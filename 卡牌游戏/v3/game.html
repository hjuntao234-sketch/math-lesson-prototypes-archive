<title>罗盘指挥官</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/* 布局：作战桌。顶栏切页并显示境界与经验；战斗页三栏——左敌人、中当前这一步、右作战记录；窄屏叠成一列。
   颜色：石板青的桌面 + 黄铜指挥色；四种牌各有一色：队友赤、装备钢蓝、情报青绿、事件琥珀。 */
:root{
  --bg:#e6ecef; --grid:rgba(21,33,42,.05); --surface:#f8fafb; --surface-2:#edf2f4; --ink:#15212a; --muted:#566874; --line:#c6d1d8;
  --brass:#8a5d0c; --brass-soft:#f3e6c9; --on-brass:#fffaf0;
  --team:#a83a34; --team-soft:#f6e2df; --gear:#275e89; --gear-soft:#dde9f3; --intel:#17705f; --intel-soft:#d8eee8; --event:#8a5f12; --event-soft:#f4e8d0;
  --ok:#24704a; --ok-soft:#dcefe3; --bad:#a3271f; --bad-soft:#f8e0dc; --fog:#d3dce1; --fog-line:rgba(21,33,42,.07); --leaf:#3f8a3a; --dry:#a68a52;
  --shadow:0 1px 2px rgba(20,33,42,.07),0 8px 20px rgba(20,33,42,.07);
  --f-display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-math:"STIX Two Math","Cambria Math","Latin Modern Math",math,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d161c; --grid:rgba(228,236,240,.035); --surface:#16232c; --surface-2:#1d2c36; --ink:#e4ecf0; --muted:#94a6b1; --line:#2b3c47;
  --brass:#d9a846; --brass-soft:#3a2f1a; --on-brass:#1a1408;
  --team:#e8817a; --team-soft:#3b2326; --gear:#7cb2db; --gear-soft:#1b2e3e; --intel:#5fc6af; --intel-soft:#153a33; --event:#e2b862; --event-soft:#3a3020;
  --ok:#74ca96; --ok-soft:#173527; --bad:#f08b81; --bad-soft:#3e2121; --fog:#1f2d36; --fog-line:rgba(228,236,240,.05); --leaf:#7cc46f; --dry:#b89a62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d161c; --grid:rgba(228,236,240,.035); --surface:#16232c; --surface-2:#1d2c36; --ink:#e4ecf0; --muted:#94a6b1; --line:#2b3c47;
  --brass:#d9a846; --brass-soft:#3a2f1a; --on-brass:#1a1408;
  --team:#e8817a; --team-soft:#3b2326; --gear:#7cb2db; --gear-soft:#1b2e3e; --intel:#5fc6af; --intel-soft:#153a33; --event:#e2b862; --event-soft:#3a3020;
  --ok:#74ca96; --ok-soft:#173527; --bad:#f08b81; --bad-soft:#3e2121; --fog:#1f2d36; --fog-line:rgba(228,236,240,.05); --leaf:#7cc46f; --dry:#b89a62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
math{font-family:var(--f-math);font-size:1.1em}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--brass);font-weight:700}
.muted{color:var(--muted)}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:21px;letter-spacing:.04em}
.seal{width:30px;height:30px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;color:var(--brass);font-size:15px;flex:none}
.nav{display:flex;flex-wrap:wrap;gap:2px}
.nav a{color:var(--muted);text-decoration:none;padding:5px 9px;border-radius:6px;font-size:14px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2);font-weight:500}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.xp .rk{font-weight:700;color:var(--ink);font-size:13px}
.xp .bar{width:96px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.xp .bar i{display:block;height:100%;background:var(--brass)}
.xp button{border:0;border-radius:999px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer;background:var(--brass);color:var(--on-brass)}
.xp .wait{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg span{font-size:12px;color:var(--muted);padding:0 4px 0 10px}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass)}

.wrap{max-width:1240px;margin:0 auto;padding-block:26px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.small{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
select,input[type=text]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}

/* 牌 */
.hand{display:flex;flex-wrap:wrap;gap:14px}
.gc{--c:var(--team);--cs:var(--team-soft);position:relative;width:180px;max-width:100%;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;font:inherit;color:inherit;padding:0;box-shadow:var(--shadow);
  transition:transform .15s ease,border-color .15s ease}
button.gc{cursor:pointer}
button.gc:not(:disabled):hover{transform:translateY(-3px);border-color:var(--c)}
button.gc:disabled{cursor:default}
.gc.t-gear{--c:var(--gear);--cs:var(--gear-soft)}
.gc.t-intel{--c:var(--intel);--cs:var(--intel-soft)}
.gc.t-event{--c:var(--event);--cs:var(--event-soft)}
.gc .kind{display:block;font-size:11px;letter-spacing:.16em;color:var(--c);font-weight:700;padding:9px 12px 0}
.gc .face{display:grid;place-items:center;height:70px;margin:6px 12px 0;border-radius:8px;background-color:var(--cs);
  background-image:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--c) 12%,transparent) 9px 10px);
  font-family:var(--f-display);font-size:40px;color:var(--c);line-height:1}
.gc .face.formula{font-family:var(--f-body);font-size:15px;color:var(--ink);padding:0 6px;text-align:center}
.gc .nm{display:block;padding:8px 12px 0;font-weight:700;font-size:15px}
.gc .nick{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.gc .tx{display:block;padding:4px 12px 12px;font-size:13px;color:var(--muted);line-height:1.55}
.gc .new{position:absolute;top:8px;right:10px;font-size:11px;color:var(--on-brass);background:var(--brass);border-radius:999px;padding:0 7px}
.gc.sel{border-color:var(--c);outline:2px solid var(--c);outline-offset:-1px}
.gc.hit{border-color:var(--ok)}
.gc.miss{opacity:.55}
.gc .mark{position:absolute;top:8px;right:10px;font-weight:700;font-size:15px}
.gc.hit .mark{color:var(--ok)} .gc.miss .mark{color:var(--bad)}
.gc.wide{width:auto}
.gc dl{margin:0;padding:6px 12px 12px;display:grid;gap:6px;font-size:13px}
.gc dt{color:var(--muted);font-size:12px}
.gc dd{margin:0}
.gc.unmet .face{filter:grayscale(1);opacity:.6}

/* 标题页 */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:8px 24px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,7vw,76px);line-height:1.05;letter-spacing:.04em;margin:10px 0 16px}
.prologue{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;max-width:36em}
.fan{position:relative;height:300px}
.fan .gc{position:absolute;top:20px;left:50%;width:180px}
.fan .gc:nth-child(1){transform:translateX(-118%) rotate(-9deg)}
.fan .gc:nth-child(2){transform:translateX(-50%) translateY(-10px);z-index:2}
.fan .gc:nth-child(3){transform:translateX(18%) rotate(9deg)}
details.memo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:8px}
details.memo summary{cursor:pointer;font-weight:700}
.memo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:12px;font-size:14px}
.memo-grid h3{font-size:13px;color:var(--brass);letter-spacing:.08em;margin-bottom:6px}
.memo-grid ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.demo{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px}

/* 对话 */
.talk{display:flex;flex-direction:column;gap:12px;margin:6px 0 16px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;background:var(--team-soft);color:var(--team)}
.av.rival{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.av.narr{background:transparent;color:var(--brass);border:1px dashed var(--brass);font-size:16px}
.bubble{background:var(--surface-2);border-radius:4px 12px 12px 12px;padding:8px 14px}
.bubble.narr{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.who{display:block;font-size:12px;color:var(--muted)}

/* 页面头 */
.page-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:18px}
.page-h h1{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.03em}
.sec{margin-top:28px}
.sec > h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin-bottom:4px}
.sec > p{margin-bottom:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}

/* 地图 */
.prolog-path{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.node{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.node .no{width:32px;height:32px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums}
.node.locked .no{border-color:var(--line);color:var(--muted)}
.node .nm{font-weight:700}
.node .why{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.brass{color:var(--brass);border-color:var(--brass)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.field-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.colm{display:flex;flex-direction:column;gap:10px;min-width:0}
.colm > h3{font-family:var(--f-display);font-weight:400;font-size:20px}
.camp{border:2px dashed var(--brass);border-radius:10px;padding:8px 12px;font-size:13px;background:var(--brass-soft)}
.stn{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;min-width:0}
.stn h4{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.stn.fog{background-color:var(--fog);background-image:repeating-linear-gradient(135deg,transparent 0 12px,var(--fog-line) 12px 13px);color:var(--muted)}
.stn.lit{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.stn .cards{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.cardbtn{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;cursor:pointer;width:100%}
.cardbtn:hover{border-color:var(--brass)}
.cardbtn.done{border-color:var(--ok)}
.cardbtn .st{color:var(--muted);font-size:12px;white-space:nowrap}
.ruin{display:block;margin-top:6px;font-size:12px;color:var(--event);background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.lore{background:var(--event-soft);border-radius:12px;padding:14px 18px;margin-top:14px}
.lore p+p{margin-top:6px}
@media (max-width:1000px){.field-map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.field-map{grid-template-columns:minmax(0,1fr)}}

/* 战斗 */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.steps li{display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.steps li small{font-size:11px;color:var(--brass)}
.steps li.now{border-color:var(--brass);color:var(--ink);font-weight:700;background:var(--brass-soft)}
.steps li.done{color:var(--ok)}
.battle{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,250px);gap:20px;align-items:start}
.enemy .q{font-size:17px;line-height:1.95;margin:10px 0 14px}
.enemy h2{font-family:var(--f-display);font-weight:400;font-size:23px;margin-top:2px}
.weak{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.weak li{border:1px dashed var(--line);border-radius:8px;padding:7px 12px;font-size:14px;color:var(--muted)}
.weak li.got{border:1px solid var(--intel);background:var(--intel-soft);color:var(--ink);animation:reveal .35s ease}
.traps{margin-top:12px;font-size:13px}
.traps b{color:var(--bad);font-weight:500}
.loadout{margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.loadout b{color:var(--ink)}
.stamp{display:inline-block;margin-top:14px;font-family:var(--f-display);font-size:32px;color:var(--ok);border:3px solid var(--ok);padding:0 16px;border-radius:8px;transform:rotate(-5deg);animation:stamp .35s ease}
@keyframes reveal{from{transform:scale(.97);background:var(--surface)}to{transform:none}}
@keyframes stamp{from{transform:rotate(-5deg) scale(1.5)}to{transform:rotate(-5deg) scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:1101px){.enemy{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
@media (max-width:1100px){.battle{grid-template-columns:minmax(0,1fr)}}
.center h2{font-family:var(--f-display);font-weight:400;font-size:27px;letter-spacing:.02em}
.ask{color:var(--muted);margin:4px 0 16px}
.msg{margin-top:16px;padding:11px 14px;border-radius:8px;background:var(--surface-2)}
.msg.bad{background:var(--bad-soft)}
.msg.good{background:var(--ok-soft)}
.msg.info{background:var(--brass-soft)}
.checks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:baseline}
.checks .mk{font-weight:700;text-align:center}
.mk.ok{color:var(--ok)} .mk.bad{color:var(--bad)} .mk.unk{color:var(--muted)} .mk.info{color:var(--brass)}
.reasons{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.reasons p{font-weight:700}
.reasons button,.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}
.reasons button:hover,.opt:hover{border-color:var(--brass)}
.opt.miss{opacity:.55;cursor:default}
.opts{display:flex;flex-direction:column;gap:8px}
.est{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.est button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:14px;font:inherit;cursor:pointer;text-align:left}
.est button:hover{border-color:var(--brass)}
.est b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px}
.est span{font-size:13px;color:var(--muted)}
.do-row{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.do-row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.do-row input{font-size:19px;width:140px;max-width:100%;font-variant-numeric:tabular-nums}
.ladder{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.ladder ol{margin:10px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.five{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.five .stp{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2)}
.five dl{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 10px;margin:0;font-size:14px}
.five dt{font-family:var(--f-display);color:var(--brass);font-size:16px}
.five dd{margin:0}
.log h3{font-size:13px;letter-spacing:.1em;color:var(--brass);margin-bottom:10px}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.log li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px}
.shadow{margin-bottom:12px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.rumor{background:var(--event-soft);border-radius:10px;padding:12px 16px;margin:12px 0}
.rumor b{color:var(--event)}
.result-sec{margin-top:14px}
.result-sec h3{font-size:13px;letter-spacing:.08em;color:var(--brass);margin-bottom:6px}
.forge{display:flex;flex-direction:column;gap:10px}
.forge .it{background:var(--surface-2);border-radius:10px;padding:10px 14px}

/* 牌组、笔记 */
.dk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;max-width:46em}
.quote p{font-size:17px}
.quote cite{display:block;margin-top:6px;font-style:normal;color:var(--muted);font-size:13px}
.notes{display:flex;flex-direction:column;gap:14px}
.note{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.note .who-c{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.note .glyph{width:54px;height:54px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;background:var(--cs);color:var(--c)}
.note.t-team{--c:var(--team);--cs:var(--team-soft)} .note.t-gear{--c:var(--gear);--cs:var(--gear-soft)} .note.t-intel{--c:var(--intel);--cs:var(--intel-soft)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{background:var(--surface-2);border-radius:8px;padding:8px 12px;min-width:0}
.field .k{display:block;font-size:12px;color:var(--muted)}
.field.locked .v{color:var(--muted)}
.own{margin-top:10px}
.own textarea{width:100%;box-sizing:border-box;min-height:56px;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);resize:vertical}
.own textarea:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* 菜园 */
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.plot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.plot.due{border-color:var(--brass)}
.plot.dry{background:color-mix(in srgb,var(--dry) 10%,var(--surface))}
.plot .pic{height:64px;display:flex;align-items:end}
.plot .pic svg{height:64px;width:64px}
.plot .q{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px}

/* 训练场、好友、档案 */
.lines{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px 12px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);padding:8px 12px;border-radius:8px;word-break:break-all;font-size:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.cmp th,.cmp td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.cmp th{font-size:12px;color:var(--muted);font-weight:500}
.cmp td.n{font-variant-numeric:tabular-nums;width:40px;text-align:right}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--muted)}
.bar.now i{background:var(--brass)}
.track{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.track .st{padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.track .st.on{border-color:var(--brass);color:var(--ink);background:var(--brass-soft);font-weight:700}
.track .st.past{color:var(--ok);border-color:var(--ok)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center}
.empty p{margin-bottom:12px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:14px;max-width:min(360px,calc(100vw - 32px))}
@media (max-width:760px){.note{grid-template-columns:minmax(0,1fr)}.fields,.two,.memo-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.fan{height:270px}}
@media (max-width:560px){.est{grid-template-columns:minmax(0,1fr)}.fan{overflow:hidden}.fan .gc{width:150px}.fan .gc .tx{display:none}
  .fan .gc:nth-child(1){transform:translateX(-100%) rotate(-8deg)}.fan .gc:nth-child(3){transform:translateX(0) rotate(8deg)}}
/* 视觉小说：叠在图片上，固定一种深色外观 */
.vn{position:fixed;inset:0;z-index:30;background:#05090c;cursor:pointer;overflow:hidden}
.vn-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.vn-bg.in{animation:vnfade .5s ease}
@keyframes vnfade{from{opacity:.15}to{opacity:1}}
.vn-sprite{position:absolute;bottom:0;left:50%;height:min(86vh,900px);width:auto;max-width:none;transform:translateX(-50%);transition:opacity .3s ease,transform .3s ease;pointer-events:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.vn-sprite.off{opacity:0;transform:translateX(-50%) translateY(14px)}
.vn-box{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(980px,calc(100% - 32px));box-sizing:border-box;background:rgba(12,19,25,.88);color:#eef3f5;border:1px solid rgba(217,168,70,.55);border-radius:14px;padding:22px 22px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.vn-name{position:absolute;top:-15px;left:18px;padding:3px 14px;border-radius:8px;background:#d9a846;color:#1a1408;font-weight:700;font-size:14px}
.vn-text{font-size:19px;line-height:1.75;min-height:3.5em}
.vn-text.narr{color:#c9d4da}
.vn-ctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:#8fa1ab}
.vn-ctl button{border:1px solid rgba(255,255,255,.28);background:transparent;color:#d6dee3;border-radius:6px;padding:3px 12px;font:inherit;cursor:pointer}
@media (max-width:600px){.vn-text{font-size:16px}.vn-sprite{height:68vh}}
.gc .face.img{padding:0;overflow:hidden;background-image:none}
.gc .face.img img{width:100%;height:100%;object-fit:cover;object-position:50% 9%}

<script>
'use strict';
// 数据：从学科罗盘 v1.18《不等式》页只读抽出（不含真题）。数学文字原样，游戏只加外壳。
const D=__DATA__;
// 剧情：Gemini 初稿，Claude 按规矩修订（原稿和改动见 gemini/回收/）。图：Gemini 生成，抠图压缩后内嵌。
const VN=__VN__;
const IMG=__IMG__;
const R=String.raw;
const KEY='compass-adventure-mock-v3';

/* ===== 两种外观：同一套数据，只换叫法 ===== */
const LOOKS={
  adv:{brand:'罗盘指挥官',map:'世界地图',deck:'牌组',garden:'菜园',train:'训练场',notes:'观察笔记',friends:'好友',record:'逆袭档案',
       enemy:'敌人',team:'队友',gear:'装备',intel:'情报',win:'击退',slot:'？ 弱点还没看穿',est:['胜算大','胜算中','胜算小'],cert:'已认证',self:'指挥官亲自出手'},
  plain:{brand:'学科罗盘 · 练习',map:'章节',deck:'工具箱',garden:'复习园',train:'找错练习',notes:'知识笔记',friends:'同学',record:'进步记录',
       enemy:'题目',team:'思路',gear:'工具',intel:'题目特征',win:'做对了',slot:'？ 还没找到',est:['把握大','把握中','把握小'],cert:'已掌握',self:'直接用工具'}
};
const PH={event:['开战前','开始前',''],intent:['它要你做什么','这题要你做什么','凭·信号'],look:['看穿弱点','找特征','凭·信号'],gear:['带装备','选工具','凭'],
  team:['派队友','选思路','想'],est:['估胜算','估把握','估'],do:['亲手结算','自己算','做'],result:['战果','结果','对']};
const FIELD={look:'长什么样',do:'它做什么',why:'为什么这么做',fail:'什么时候不灵'};
const REALMS=['见习','斥候','参谋','指挥官','统帅'];
const PER=60;          // 每级经验
const WATER=[1,2,4,7,15]; // 菜园浇水间隔（天）
const NICK={'转化与化归':'阿化','整体代换':'阿替','构造':'阿构','函数思想':'阿函','方程思想':'阿程','分类讨论':'阿分','退化与边界':'阿界',
  '存在性检验':'阿验','数形结合':'阿形','特殊化':'阿特','正难则反':'阿反','回到定义':'阿义','放缩':'阿缩'};
// 招式＝找路里的起手。归属是暂定，只分了一眼能对上的六个。
const MOVES={'转化与化归':['diff'],'整体代换':['whole'],'分类讨论':['classify'],'正难则反':['backward'],'存在性检验':['necessary'],'特殊化':['probe']};
const ST=Object.fromEntries(D.strategies.map(s=>[s.name,s]));
const AT=Object.fromEntries(D.atoms.map(a=>[a.id,a]));
const CARD=Object.fromEntries(D.cards.map(c=>[c.n,c]));
const MOVE=Object.fromEntries(D.moves.map(m=>[m.id,m]));
const STN=Object.fromEntries([...D.stations.map(s=>({...s})),...D.groups.map(g=>({id:g.id,name:g.name,cards:g.cards,col:0,parents:[],group:true}))].map(s=>[s.id,s]));
const CODE=Object.fromEntries(D.codes.map(c=>[c.id,c]));

/* ===== 存档：只在这台设备的浏览器里 ===== */
function blank(){return {look:'adv',dayOffset:0,unlockAll:false,xp:0,realm:0,realmStart:0,capDate:null,examTried:null,xpLog:[],xpOnce:{},
  runs:[],notes:{},garden:{},cert:{},team:{'转化与化归':'序幕','整体代换':'序幕'},rumors:[],train:{},seen:{}};}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return v?Object.assign(blank(),v):blank();}catch(e){return blank();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
let L=LOOKS[S.look]||LOOKS.adv;
let B=null,page='title',cur=null,ui={};

/* ===== 小工具 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function m(tex){try{if(window.katex)return katex.renderToString(tex,{output:'mathml',throwOnError:false});}catch(e){}return '<code>'+esc(tex)+'</code>';}
function tx(s){s=String(s??'').replace(/【([A-Z]+-[A-Z]\d+)】/g,(_,id)=>'【'+(AT[id]?AT[id].name:id)+'】');
  return s.split(/(\$[^$]+\$)/g).map(p=>p.length>1&&p[0]==='$'&&p[p.length-1]==='$'?m(p.slice(1,-1)):esc(p).replace(/\n/g,'<br>')).join('');}
function day(off=0){const d=new Date();d.setDate(d.getDate()+(S.dayOffset||0)+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const today=()=>day(0);
function addDays(ds,n){const [y,mo,dd]=ds.split('-').map(Number);const d=new Date(y,mo-1,dd+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function pick(list,n,seed){return list.map(x=>[hash(seed+'|'+(x.id||x.name||x.text||(typeof x==='string'?x:JSON.stringify(x)))),x]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]);}
const adv=()=>S.look==='adv';
const nick=n=>NICK[n]||n;
const tname=n=>n==='self'?L.self:n==='trap'?(adv()?'名录院的打法':'照名字直接套'):adv()?nick(n)+' · '+n:n;
const tglyph=n=>n==='self'?'你':n==='trap'?'名':(NICK[n]||n)[1];
function num(v){if(v==null)return null;v=String(v).replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/^[a-z]=/i,'');if(v==='')return null;
  const f=v.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(f)return Number(f[1])/Number(f[2]);const n=Number(v);return Number.isFinite(n)?n:null;}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(ui.tt);ui.tt=setTimeout(()=>{el.hidden=true;},2600);}

/* ===== 经验、境界、突破 ===== */
function lv(){const inR=S.xp-S.realmStart,level=Math.min(5,Math.floor(inR/PER)+1),full=inR>=PER*5;return {inR,level,full,pct:full?100:Math.round((inR%PER)/PER*100)};}
function gain(n,why,once){
  if(once){if(S.xpOnce[once])return 0;S.xpOnce[once]=today();}
  const before=lv().full;S.xp+=n;S.xpLog.unshift({date:today(),n,why});S.xpLog=S.xpLog.slice(0,40);
  if(!before&&lv().full&&!S.capDate)S.capDate=today();
  save();toast('+'+n+' 经验 · '+why);return n;
}
function canBreak(){const v=lv();return v.full&&S.capDate&&today()>S.capDate&&S.examTried!==today();}

/* ===== 观察笔记、菜园、认证、队友 ===== */
function noteOf(id){return S.notes[id]||(S.notes[id]={seen:{},own:''});}
function see(id,f){if(!id)return;const n=noteOf(id);if(!n.seen[f]){n.seen[f]=today();if(B&&page==='battle')B.newNotes.push([id,f]);save();}}
function entry(id){if(ST[id]){const s=ST[id];return {type:'team',name:id,nick:NICK[id],glyph:NICK[id][1],note:{look:s.when,do:s.one,why:s.why,fail:s.boundary}};}
  const a=AT[id];return {type:a.kind==='知识'?'gear':'intel',name:a.name,glyph:a.kind==='知识'?'凭':'察',note:{look:a.look,do:a.do,why:a.why,fail:a.fail}};}
function plant(id){if(!AT[id]||S.garden[id])return;S.garden[id]={plant:today(),last:today(),w:0};if(B)B.planted.push(id);save();}
function dueOf(g){return addDays(g.last,WATER[Math.min(g.w,WATER.length-1)]);}
function certified(id){return !!S.cert[id]||((S.garden[id]||{}).w||0)>=2;}
function recruit(n){if(S.team[n])return false;S.team[n]=today();gain(10,'招募 '+nick(n),'recruit-'+n);save();return true;}
function cleared(key){return S.runs.some(r=>r.key===key&&r.mode!=='sweep');}
function lastRun(key){const rs=S.runs.filter(r=>r.key===key&&r.mode!=='sweep');return rs[rs.length-1]||null;}

/* ===== 关卡模板（序章、出题对决、突破考核共用） ===== */
const TPL={A:{name:'乘积守卫',plain:'积是定值'},B:{name:'披外衣的守卫',plain:'先换元再用'},C:{name:'翻面守卫',plain:'负数求最大'},D:{name:'带系数的守卫',plain:'系数不同'}};
function ivA(k){return [{text:'分母是 $x-1$',ok:false,fb:'再看一眼：这题分母就是 $x$，没有 $x-1$。'},
  {text:'两项相加，一乘 $x$ 就消掉',ok:true,atom:'I-S2',weak:`乘积是定值：$${k}$`,got:`看穿了：两项乘起来是 $${k}$，是一个数。`},
  {text:'有平方项 $x^2$',ok:false,fb:'题里没有 $x^2$。没看到的东西，不能当情报。'},
  {text:'范围说 $x>0$',ok:true,atom:'I-K1',weak:'两项都是正数',got:'看穿了：$x>0$，所以两项都是正数。'}];}
function teamDirect(k){return [{who:'self',ok:true,go:'冲上去了。最后这一下，你亲手算。',reasons:[[`两项都是正数，乘起来是定值 $${k}$`,true],['看到分式，就套公式',false,'看到分式不一定能套。先看：乘起来是不是一个数？'],['最快',false,'快不是理由。想想：装备的三条，这题满足了几条？']]},
  {who:'整体代换',ok:'idle',fb:'能派，但白跑一趟：这题没有要打包的整体，换了还是它。'},
  {who:'分类讨论',ok:'idle',fb:'用不上：$x>0$ 已经给定，没有要分的情况。'}];}
function makeTpl(t,p){
  const r=x=>Math.sqrt(x);
  if(t==='A'){const k=p.k;return {t,p,name:TPL.A.name,q:`已知 $x>0$，求 $x+\\dfrac{${k}}{x}$ 的最小值。`,kind:'最小值',intel:ivA(k),
    gear:[{atom:'I-K7',ok:false,fb:'作差是比两个式子谁大用的。这里只有一个式子，要找它最小是多少。'},
      {atom:'I-K3',ok:true,checks:[['两项都是正数：$x>0$','ok'],[`乘起来是定值：$${k}$`,'ok'],[`两项能相等：$x=\\dfrac{${k}}{x}$ 有正数解`,'ok']],after:'三条都满足，装备可以直接用。'},
      {atom:'I-K6',ok:'idle',fb:'先留着：算等号点时用得上。'}],
    team:teamDirect(k),ans:[2*r(k),r(k)],labels:['最小值','取到时 x ='],
    hints:[`两项都是正数，乘积是 $${k}$。`,`所以 $x+\\dfrac{${k}}{x}\\ge 2\\sqrt{${k}}$。`,`等号要 $x=\\dfrac{${k}}{x}$，再看 $x>0$。`]};}
  if(t==='B'){const k=p.k,a=p.a;return {t,p,name:TPL.B.name,q:`已知 $x>${a}$，求 $x+\\dfrac{${k}}{x-${a}}$ 的最小值。`,kind:'最小值',
    intel:[{text:'两项相加，一乘 $x$ 就消掉',ok:false,note:['I-S2','fail'],fb:`乘一下看看：$x\\cdot\\dfrac{${k}}{x-${a}}$，$x$ 没消掉。这正是它的伪装。`},
      {text:`前面是 $x$，分母是 $x-${a}$`,ok:true,atom:'I-S5',weak:`前后差一个 $${a}$，不配套`,got:`看穿了：前面是 $x$，分母是 $x-${a}$，差一个 $${a}$。`},
      {text:'有平方项 $x^2$',ok:false,fb:'题里没有 $x^2$。没看到的东西，不能当情报。'},
      {text:`范围说 $x>${a}$`,ok:true,atom:'I-K1',weak:`$x-${a}$ 是正数`,got:`看穿了：$x>${a}$，所以 $x-${a}>0$。`}],
    gear:[{atom:'I-K3',ok:true,checks:[[`两项都是正数：$x>${a}$`,'ok'],[`乘起来是定值？$x\\cdot\\dfrac{${k}}{x-${a}}$ 还带着 $x$`,'bad'],['两项能相等？先把样子变对，再看','unk']],after:'装备没拿错，只是敌人披着外衣，现在打不动。下一步：派个队友，先把外衣扒下来。'},
      {atom:'I-K7',ok:false,fb:'作差是比两个式子谁大用的。这里只有一个式子，要找它最小是多少。'},
      {atom:'I-K6',ok:'idle',fb:'先留着：算等号点时用得上。'}],
    team:[{who:'trap',reasons:[[R`两项相加，就套 $a+b\ge 2\sqrt{ab}$`],['名录上就是这么写的']],fail:`$x+\\dfrac{${k}}{x-${a}}\\ge 2\\sqrt{\\dfrac{${k}x}{x-${a}}}$。右边还带着 $x$，不是一个数，这一招打空了。`},
      {who:'整体代换',skill:'换元',ok:true,go:`令 $t=x-${a}$，前后配套了。接下来怎么算，你来。`,reasons:[[`把 $x-${a}$ 打包成 $t$，前后就配套了`,true],['换元能让式子变短',false,'变短不是目的。想想：换完以后，前后能不能配套？']]},

      {who:'分类讨论',ok:'idle',fb:`用不上：$x>${a}$ 已经给定。`}],
    ans:[2*r(k)+a,a+r(k)],labels:['最小值','取到时 x ='],
    hints:[`令 $t=x-${a}$。因为 $x>${a}$，所以 $t>0$，$x=t+${a}$。`,`原式 $=t+\\dfrac{${k}}{t}+${a}$。`,`$t+\\dfrac{${k}}{t}\\ge 2\\sqrt{${k}}$，再加上那个 $${a}$。`,`等号要 $t=\\dfrac{${k}}{t}$，算出 $t$，再换回 $x$。`]};}
  if(t==='C'){const k=p.k;return {t,p,name:TPL.C.name,q:`已知 $x<0$，求 $x+\\dfrac{${k}}{x}$ 的最大值。`,kind:'最大值',
    intel:[{text:'两项都是正数',ok:false,fb:'看范围：$x<0$，两项都是负的。很多人在这里看走眼。'},

      {text:'两项相加，一乘 $x$ 就消掉',ok:true,atom:'I-S2',weak:`乘积是定值：$${k}$`,got:`看穿了：乘起来还是 $${k}$。`}],
    gear:[{atom:'I-K6',ok:'idle',fb:'先留着：算等号点时用得上。'},
      {atom:'I-K3',ok:true,checks:[['两项都是正数？$x<0$，两项都是负的','bad'],[`乘起来是定值：$${k}$`,'ok'],['两项能相等？翻成正的再看','unk']],after:'装备的第一条没满足，直接用会反弹。下一步：派个能处理负数的队友。'},
      {atom:'I-K7',ok:false,fb:'作差是比两个式子谁大用的。这里只有一个式子，要找它最大是多少。'}],
    team:[{who:'trap',reasons:[['两项相加，就套公式'],['昨天就是这么赢的']],fail:'可 $x<0$，两项都是负的，装备的第一条没满足，攻击反弹。'},
      {who:'转化与化归',skill:'提负号',ok:true,go:`先看 $-x$ 和 $-\\dfrac{${k}}{x}$，两项都翻成正的了。接下来怎么算，你来。`,reasons:[['两项都是负的，先翻成正的',true],['负号看着碍眼',false,'不是因为碍眼。想想：装备要求两项是什么数？']]},

    hints:[`$-x>0$，$-\\dfrac{${k}}{x}>0$，两项都是正数。`,`$(-x)+\\left(-\\dfrac{${k}}{x}\\right)\\ge 2\\sqrt{${k}}$。`,'两边乘 $-1$，不等号翻过来。',`等号要 $-x=-\\dfrac{${k}}{x}$，再看 $x<0$。`]};}
  if(t==='D'){const mm=p.m,n=p.n,k=mm*n*n,pr=mm*k;return {t,p,name:TPL.D.name,q:`已知 $x>0$，求 $${mm}x+\\dfrac{${k}}{x}$ 的最小值。`,kind:'最小值',
    intel:[{text:'系数不一样，就不能用',ok:false,fb:`系数不碍事：$${mm}x\\cdot\\dfrac{${k}}{x}=${pr}$，乘起来照样是一个数。`},
      {text:'两项相加，一乘 $x$ 就消掉',ok:true,atom:'I-S2',weak:`乘积是定值：$${pr}$`,got:`看穿了：$${mm}x\\cdot\\dfrac{${k}}{x}=${pr}$。`},
      {text:'范围说 $x>0$',ok:true,atom:'I-K1',weak:'两项都是正数',got:'看穿了：两项都是正数。'}],
    gear:[{atom:'I-K3',ok:true,checks:[['两项都是正数：$x>0$','ok'],[`乘起来是定值：$${pr}$`,'ok'],[`两项能相等：$${mm}x=\\dfrac{${k}}{x}$ 有正数解`,'ok']],after:'三条都满足，装备可以直接用。'},
      {atom:'I-K7',ok:false,fb:'作差是比两个式子谁大用的。这里只有一个式子。'},{atom:'I-K6',ok:'idle',fb:'先留着：算等号点时用得上。'}],
    team:teamDirect(pr),ans:[2*mm*n,n],labels:['最小值','取到时 x ='],

}
function validTpl(t,p){const sq=k=>Number.isInteger(Math.sqrt(k));
  if(t==='A'||t==='C')return Number.isInteger(p.k)&&p.k>0&&p.k<=400&&sq(p.k);
  if(t==='B')return Number.isInteger(p.k)&&p.k>0&&p.k<=400&&sq(p.k)&&Number.isInteger(p.a)&&p.a>=1&&p.a<=20;
  if(t==='D')return Number.isInteger(p.m)&&p.m>=2&&p.m<=9&&Number.isInteger(p.n)&&p.n>=1&&p.n<=9;return false;}

function tplState(key){const i={p1:0,p2:1,p3:2}[key];if(cleared(key))return 'done';
  if(i===0)return 'open';if(i===1)return cleared('p1')?'open':'locked';
  const g=S.runs.find(r=>r.key==='p1'||r.key==='p2');if(!g)return 'locked';return today()>g.date?'open':'wait';}
function sweepable(key){if(!cleared(key))return false;const ids=key[0]==='p'?['I-K3']:(()=>{const c=CARD[+key.slice(1)];const k=c.atoms.filter(a=>AT[a]&&AT[a].kind==='知识');return k.length?k:c.atoms;})();
  return ids.length>0&&ids.every(certified);}

function newB(o){return Object.assign({phase:'event',found:[],tried:{},looks:0,wrong:{intel:0,gear:0,team:0,reason:0,do:0},hints:0,est:null,gearOk:false,gearIdx:null,team:null,pending:null,

function startSweep(key){if(key[0]==='p'){const st={p1:makeTpl('A',{k:4}),p2:makeTpl('B',{k:9,a:1}),p3:makeTpl('C',{k:4})}[key];B=newB({kind:'tpl',key,st,mode:'sweep',phase:'do'});}

        :msgBox()+(noNeed?`<div class="msg bad">要用的装备没带进场。这一阶段只能靠提示硬算（会记一步提示）。</div><div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="nogear">不带装备，硬算</button></div>`:'')}`;}
  if(B.phase==='team'){const pend=B.pending!==null?st.team[B.pending]:null;const reasons=pend?(pend.reasons||[['它擅长这个'],['先派了再说']]):[];

function estHTML(){const sub=['我认得这种，能做完','有思路，不一定算对','还没把握'];

/* ===== 真卡：从罗盘五格数据生成 ===== */
function cardStage(c){
  const n=c.n,st={phases:[]};
  const lab=D.labels.find(l=>l.stations.includes(c.station));
  if(lab){const others=pick(D.labels.filter(l=>l!==lab),2,'lab'+n);st.intent=pick([lab,...others],3,'labo'+n).map((l,i)=>({key:'i'+i,text:l.text,ok:l===lab,weak:'它要你：'+l.text.replace(/^要我/,'')}));st.phases.push('intent');}
  const sAt=c.atoms.filter(id=>AT[id]&&AT[id].kind==='结构'),kAt=c.atoms.filter(id=>AT[id]&&AT[id].kind==='知识');
  if(sAt.length){const dec=pick(D.atoms.filter(a=>a.kind==='结构'&&!sAt.includes(a.id)),2,'s'+n).map(a=>a.id);
    st.look=pick([...sAt.slice(0,2),...dec],4,'so'+n).map(id=>({key:'a'+id,atom:id,text:AT[id].look,ok:sAt.includes(id),weak:AT[id].name+'：'+AT[id].do}));st.phases.push('look');}
  if(kAt.length){const dec=pick(D.atoms.filter(a=>a.kind==='知识'&&!kAt.includes(a.id)),2,'k'+n).map(a=>a.id);
    st.gear=pick([...kAt.slice(0,2),...dec],4,'ko'+n).map(id=>({atom:id,ok:kAt.includes(id)}));st.phases.push('gear');}
  const good=D.strategies.filter(s=>s.cards.includes(n)).map(s=>s.name);
  if(good.length){const pool=D.strategies.filter(s=>!good.includes(s.name)).map(s=>s.name);
    const dec=pick(pool.filter(x=>S.team[x]),2,'t'+n);if(dec.length<2)dec.push(...pick(pool.filter(x=>!dec.includes(x)),2-dec.length,'t2'+n));
    st.team=pick([...good.slice(0,2),...dec],4,'to'+n).map(nm=>({who:nm,ok:good.includes(nm)}));
    const others=pick(D.cards.filter(x=>x.station!==c.station&&x.why),2,'r'+n).map(x=>x.why);
    st.reasons=pick([[c.why,true],...others.map(w=>[w,false])],3,'ro'+n);st.phases.push('team');}
  st.phases.push('est','do','result');return st;
}
function cardCenter(){
  const c=B.card,st=B.st;
  if(B.phase==='intent'||B.phase==='look'){const opts=B.phase==='intent'?st.intent:st.look;const done=opts.every(o=>!o.ok||B.found.includes(o.key));
    return `<h2>${phaseLabel(B.phase)}</h2><p class="ask">${B.phase==='intent'?(adv()?'先看它最后要你交什么。':'先看题目最后要你交什么。'):(adv()?'题里露出了哪个样子？选你亲眼看到的。':'题里有哪个特征？选你亲眼看到的。')}</p>

        :`<div class="hand">${opts.map(o=>atomCard(o.atom,{act:'cpick',arg:o.key,text:o.text,cls:B.tried[o.key]?(o.ok?'hit':'miss'):'',mark:B.tried[o.key]?(o.ok?'✓':'✗'):'',disabled:!!B.tried[o.key]||done})).join('')}</div>`}
      ${msgBox()}${done?nextBtn(nextPhase(),'下一步：'+phaseLabel(nextPhase())):''}`;}
  if(B.phase==='gear'){const done=B.gearOk;

      ${msgBox()}${B.team?nextBtn('est','下一步：'+phaseLabel('est')):''}`;}
  if(B.phase==='est')return estHTML();
  if(B.phase==='do'){const sweep=B.mode==='sweep';
    if(!B.revealed)return `<h2>${sweep?(adv()?'一刀秒':'快速复习'):phaseLabel('do')}</h2><p class="ask">${adv()?'牌不会自己赢。在草稿纸上把这道题做完，再来对。':'在草稿纸上把这道题做完，再来对。'}</p>

       :B.selfStep===2?`<div class="msg info">看懂以后，合上答案，在纸上自己重写一遍。</div><div class="row" style="margin-top:12px"><button class="btn primary" type="button" data-act="selfdone">我写好了</button></div>`
       :`<div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-act="self" data-arg="0">全对</button><button class="btn" type="button" data-act="self" data-arg="1">有一处不一样</button><button class="btn" type="button" data-act="self" data-arg="2">没做出来</button></div>`}`;}

function win(){
  const w=B.wrong;B.over=true;B.phase='result';B.secs=Math.round((Date.now()-B.t0)/1000);B.msg=null;
  const key=B.key,first=!cleared(key),clean=w.team===0&&w.reason===0&&B.hints===0&&w.do===0;
  const run={key,date:today(),wrong:Object.assign({},w),hints:B.hints,est:B.est,secs:B.secs,mode:B.mode||'normal'};
  if(B.mode==='sweep'){S.runs.push(run);save();B.log.push(['ok',adv()?'扫荡完成':'复习完成']);return;}
  const prev=B.shadow;if(B.kind==='card')B.litBefore=stationLit(STN[B.card.station]);S.runs.push(run);B.xp=[];
  if(key!=='duel'){
    if(first)B.xp.push(gain(B.kind==='card'?30:key==='boss'?100:40,'首次通关 · '+(B.kind==='card'?'卡 '+B.card.n:B.seq?'领主':B.st.name)));
    if(clean)B.xp.push(gain(15,'干净通关','clean-'+key));
    if(prev&&(mist(run)+run.hints<mist(prev)+prev.hints||(mist(run)+run.hints===mist(prev)+prev.hints&&run.secs<prev.secs))){B.beatShadow=true;B.xp.push(gain(10,'赢了过去的自己','shadow-'+key+'-'+today()));}
    if(!first&&!B.xp.some(Boolean))B.noXp=true;
  }
  if(key==='p3'&&!S.cert['I-K3']){S.cert['I-K3']=today();B.certNews=true;}
  if(clean&&adv()&&['p2','p3','boss'].includes(key)&&!S.rumors.some(r=>r.key===key)){
    B.rumor=VN.rumor[S.rumors.length%VN.rumor.length].replace(/\{看了几张情报\}/g,B.looks).replace(/\{守卫名\}/g,B.seq?'三影守卫':B.st.name);S.rumors.push({key,date:today(),text:B.rumor});}
  if(key==='p2'&&recruit('构造'))B.recruited.push('构造');
  if(B.kind==='card'&&!B.litBefore&&stationLit(STN[B.card.station])){B.litNews=STN[B.card.station].name;B.xp.push(gain(20,(adv()?'点亮据点 · ':'完成知识点 · ')+STN[B.card.station].name.replace(/\$/g,''),'lit-'+B.card.station));}
  B.vnAfter=[];
  if(key==='p1')B.vnAfter.push(clean?'p1out':'p1out@notclean');
  if(key==='p2')B.vnAfter.push(B.usedTrap?'p2out@trap':'p2out');
  if(key==='p3')B.vnAfter.push('p3out');
  if(key==='boss')B.vnAfter.push('bossOut');
  B.recruited.forEach(n=>{if(VN['recruit_'+n])B.vnAfter.push('recruit_'+n);});
  ui.scene=B.vnAfter.slice();
  B.log.push(['ok',esc(L.win)]);save();
}

function keyName(k){if(k==='boss')return adv()?'三影守卫（领主）':'三问综合题';if(k==='duel')return '出题对决';if(k[0]==='p')return adv()?{p1:TPL.A.name,p2:TPL.B.name,p3:TPL.C.name}[k]:'入门第 '+k[1]+' 题';return '卡 '+k.slice(1)+' · '+CARD[+k.slice(1)].name;}
function pRecord(){
  const head=`<div class="page-h"><div><p class="eyebrow">${adv()?'以前和现在':'进步'}</p><h1>${L.record}</h1></div><p class="muted" style="max-width:34em">每个数字都来自你在这台设备上的真实记录，没有一个是编的。</p></div>`;
  const later=`<section class="sec"><h2>以后接入</h2><p class="muted">9 月 30 日诊断卷和平行复测卷的对照。现在还没接，这里不放任何假数字。</p></section>`;
  const v=lv();
  const realm=`<section class="sec"><h2>境界</h2><div class="track">${REALMS.map((r,i)=>`<span class="st ${i===S.realm?'on':i<S.realm?'past':''}">${r}</span>`).join('<span class="muted">→</span>')}</div>
    <p class="muted" style="margin-top:8px">现在 ${REALMS[S.realm]} ${v.level} 级，共 ${S.xp} 经验。${v.full?(canBreak()?'可以去突破了。':'满级了，隔天才能考突破。'):'每级 '+PER+' 经验，5 级满了要过突破考核。'}</p></section>`;
  const runs=S.runs.filter(r=>r.mode!=='sweep');
  if(!runs.length)return head+realm+`<div class="empty" style="margin-top:20px"><p>还没有记录。打完一关，这里会出现第一条；同一关打第二次，就能看到前后对比。</p><a class="btn primary" href="#map">${adv()?'去出战':'去练习'}</a></div>`+later;
  const keys=[...new Set(runs.map(r=>r.key))];
  const metrics=[['错的次数',mist],['要了提示',r=>r.hints],['用时（秒）',r=>r.secs]];
  const cmp=keys.map(k=>{const rs=runs.filter(r=>r.key===k),a=rs[0],b=rs[rs.length-1],two=rs.length>1;
    return `<tr><td>${tx(keyName(k))}</td><td class="n">${rs.length}</td>${metrics.map(([n,f])=>{const x=f(a),y=f(b),mx=Math.max(x,y,1);return `<td class="n">${x}</td><td><div class="bar"><i style="width:${x/mx*100}%"></i></div>${two?`<div class="bar now" style="margin-top:3px"><i style="width:${y/mx*100}%"></i></div>`:''}</td><td class="n">${two?y:'—'}</td>`;}).join('')}</tr>`;}).join('');
  const certN=D.atoms.filter(a=>certified(a.id)).length;
  return head+`<div class="stats"><div class="stat"><div class="v">${runs.length}</div><div class="k">${adv()?'出战次数':'做题次数'}</div></div>
      <div class="stat"><div class="v">${litCount()}/20</div><div class="k">${adv()?'点亮的据点':'完成的知识点'}</div></div>
      <div class="stat"><div class="v">${Object.keys(S.team).length}/13</div><div class="k">${adv()?'队友':'用过的思路'}</div></div>
      <div class="stat"><div class="v">${certN}</div><div class="k">认证的${L.gear}</div></div>
      <div class="stat"><div class="v">${Object.keys(S.garden).length}</div><div class="k">${L.garden}里的植物</div></div></div>
    ${realm}
    <section class="sec"><h2>第一次和最近一次</h2><p class="muted">灰条是第一次，${adv()?'金':'深'}色条是最近一次。</p><div class="tbl-wrap"><table class="cmp"><thead><tr><th>关</th><th>次数</th>${metrics.map(([n])=>`<th>${n} · 第一次</th><th></th><th>最近</th>`).join('')}</tr></thead><tbody>${cmp}</tbody></table></div></section>
    <section class="sec"><h2>经验从哪来</h2><ul>${S.xpLog.slice(0,10).map(x=>`<li>${x.date}　+${x.n}　${esc(x.why)}</li>`).join('')||'<li class="muted">还没有。</li>'}</ul></section>
    ${adv()?`<section class="sec"><h2>江湖传闻</h2>${S.rumors.length?S.rumors.map(r=>`<div class="rumor">${esc(r.text)}<br><span class="muted">${r.date}</span></div>`).join(''):'<p class="muted">还没有传闻。传闻只记真本事：一次派对人、不要提示、一次做对。每关只传一次。</p>'}</section>`:''}
    ${adv()?storyList():''}
    ${later}`;
}

/* ===== 动作 ===== */
const ACT={
  look(v){S.look=v;save();render();},
  theme(v){document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem(KEY+'-theme',v);}catch(e){}renderTop();},
  day(n){S.dayOffset=Math.max(0,(S.dayOffset||0)+Number(n));save();render();},
  unlock(){S.unlockAll=!S.unlockAll;save();render();},
  give(){gain(100,'演示');render();},
  go(h){go(h);},
  lore(id){ui.lore=ui.lore===id?null:id;if(adv()&&!S.seen['vn:ruins'])ui.scene=['ruins'];render();},
  depart(){if(adv()&&!S.seen['vn:prologue'])playScenes(['prologue'],()=>go('map'));else go('map');},
  story(k){playScenes([k]);},
  replayvn(){playScenes(B&&B.vnAfter||[]);},
  sprite(x){S.sprite=x;save();render();},
  music(v){S.music=v==='on';save();renderTop();updateMusic();},
  phase(p){B.phase=p;B.msg=null;render();},
  intel(j){j=Number(j);const o=B.st.intel[j];if(B.tried[j])return;B.tried[j]=true;B.looks++;
    if(o.ok){B.found.push(j);see(o.atom,'look');see(o.atom,'do');plant(o.atom);B.log.push(['ok','看穿：'+tx(o.weak)]);B.msg={k:'good',h:tx(o.got)};}
    else{B.wrong.intel++;if(o.note)see(o.note[0],o.note[1]);B.log.push(['bad','看走眼：'+tx(o.text)]);B.msg={k:'bad',h:tx(o.fb)};}render();},
  gear(j){j=Number(j);const o=B.st.gear[j],a=AT[o.atom];
    if(o.ok===true){B.gearOk=true;B.gearIdx=j;B.msg=null;see(o.atom,'look');see(o.atom,'do');plant(o.atom);if(o.checks.some(c=>c[1]==='bad'))see(o.atom,'fail');B.log.push(['ok','带上：'+tx(a.name)]);}
    else if(o.ok==='idle'){B.msg={k:'info',h:tx(o.fb)};}
    else{if(!B.tried['g'+j]){B.wrong.gear++;B.log.push(['bad','带错：'+tx(a.name)]);}B.tried['g'+j]=true;see(o.atom,'look');B.msg={k:'bad',h:tx(o.fb)};}render();},
  nogear(){B.hints++;B.gearOk=true;B.gearIdx=B.st.gear.findIndex(o=>o.ok===true);B.log.push(['info','没带装备，硬算（记一步提示）']);B.msg=null;render();},
  team(j){B.pending=Number(j);B.msg=null;render();},
  reason(k){const j=B.pending,o=B.st.team[j],who=tname(o.who);
    if(o.who==='trap'){B.wrong.team++;B.trapSeen=true;B.usedTrap=true;B.triedTeam[j]=true;B.log.push(['bad',esc(who)+'：打空']);see('I-K3','fail');
      B.msg={k:'bad',h:(adv()?esc(trapLine())+'<br>':'直接套公式：')+tx(o.fail)+'<br>换一个'+L.team+'。'};B.pending=null;}
    else if(o.ok==='idle'){B.wrong.team++;B.triedTeam[j]=true;B.log.push(['bad','白跑：'+esc(who)]);B.msg={k:'bad',h:tx(o.fb)};B.pending=null;}
    else{const r=o.reasons[Number(k)];
      if(r[1]){B.team=o.who;B.pending=null;if(ST[o.who]){see(o.who,'look');see(o.who,'do');see(o.who,'why');if(recruit(o.who))B.recruited.push(o.who);}
        B.log.push(['ok','派出：'+esc(who)+'。理由：'+tx(r[0])]);B.msg={k:'good',h:(adv()&&o.who!=='self'?esc(nick(o.who))+'：'+esc(quote(o.who))+'<br>':'')+tx(o.go)+(B.recruited.includes(o.who)&&adv()&&!VN['recruit_'+o.who]&&o.who!=='构造'?'<br>“'+STORY.recruit+'”':'')};}
      else{B.wrong.reason++;B.log.push(['bad','理由不对']);B.msg={k:'bad',h:(adv()?'人派对了，':'思路对了，')+'理由不对。'+tx(r[2])};}}render();},
  est(i){B.est=Number(i);B.log.push(['info','估：'+L.est[B.est]]);B.phase='do';B.msg=null;render();},
  hint(){const max=B.kind==='card'?B.card.steps.length:B.st.hints.length;if(B.hints<max){B.hints++;B.log.push(['info','要了第 '+B.hints+' 步提示']);}render();},
  replay(){go('battle-'+B.key,true);},
  trap(){const o=B.st.team.find(t=>t.who==='trap');B.trapSeen=true;see('I-K3','fail');B.msg={k:'info',h:(adv()?'名录院的打法：':'直接套公式：')+tx(o.fail)};render();},
  forge(id){ui.forge=ui.forge===id?null:id;if(ui.forge)see(id,'why');render();},
  // 真卡
  cpick(key){const opts=B.phase==='intent'?B.st.intent:B.st.look;const o=opts.find(x=>x.key===key);if(!o||B.tried[key])return;B.tried[key]=true;B.looks++;
    if(o.ok){B.found.push(key);if(o.atom){see(o.atom,'look');see(o.atom,'do');plant(o.atom);}B.log.push(['ok','看穿：'+tx(o.weak)]);B.msg={k:'good',h:'看穿了：'+tx(o.weak)};}
    else{B.wrong.intel++;if(o.atom)see(o.atom,'look');B.log.push(['bad','看走眼']);B.msg={k:'bad',h:o.atom?'题里没有这个样子。'+(AT[o.atom].fail?'<br><span class="muted">长得像但不是：'+tx(AT[o.atom].fail)+'</span>':''):'再看一眼题目最后一句：它要你交什么？'};}render();},
  cgear(j){j=Number(j);const o=B.st.gear[j],a=AT[o.atom];if(B.tried['g'+j])return;B.tried['g'+j]=true;
    if(o.ok){B.gearOk=true;B.gearIdx=j;see(o.atom,'look');see(o.atom,'do');plant(o.atom);const all=B.st.gear.filter(x=>x.ok).map(x=>tx(AT[x.atom].name));
      B.log.push(['ok','带上：'+tx(a.name)]);B.msg={k:'good',h:'记住这一句：'+tx(a.say)+(all.length>1?'<br><span class="muted">这一关还用得上：'+all.join('、')+'</span>':'')};}
    else{B.wrong.gear++;see(o.atom,'look');B.log.push(['bad','带错：'+tx(a.name)]);B.msg={k:'bad',h:'这一关用不上它。'+(a.fail?'<br><span class="muted">它什么时候不灵：'+tx(a.fail)+'</span>':'')};}render();},
  cteam(j){B.pending=Number(j);B.msg=null;const o=B.st.team[B.pending];
    if(!o.ok){B.wrong.team++;B.triedTeam[B.pending]=true;B.log.push(['bad','派错：'+esc(tname(o.who))]);B.msg={k:'bad',h:`这道题的解法里没用到她这一招。<br><span class="muted">${esc(nick(o.who))}擅长：${tx(ST[o.who].when)}</span>`};B.pending=null;}render();},
  creason(k){const o=B.st.team[B.pending],r=B.st.reasons[Number(k)];
    if(r[1]){B.team=o.who;B.pending=null;see(o.who,'look');see(o.who,'do');see(o.who,'why');if(recruit(o.who))B.recruited.push(o.who);
      B.log.push(['ok','派出：'+esc(tname(o.who))]);B.msg={k:'good',h:(adv()?esc(nick(o.who))+'：'+esc(quote(o.who)):tx(ST[o.who].one))+(B.recruited.includes(o.who)&&adv()&&!VN['recruit_'+o.who]?'<br>“'+STORY.recruit+'”':'')};}
    else{B.wrong.reason++;B.log.push(['bad','理由不对']);B.msg={k:'bad',h:'这句理由说的是别的题。回到题目里，找让你想派她的那个地方。'};}render();},
  reveal(){B.revealed=true;render();},
  self(v){v=Number(v);if(v===0){win();render();return;}if(v===1){B.wrong.do++;B.selfStep=1;}else{B.hints=B.card.steps.length;B.selfStep=2;}B.log.push(['info',v===1?'对照后改了一处':'看了完整解答']);render();},
  selfdone(){win();render();},
  // 领主
  pick(id){const i=B.pickSel.indexOf(id);if(i>=0)B.pickSel.splice(i,1);else if(B.pickSel.length<3)B.pickSel.push(id);else toast('最多带 3 件');render();},
  bossgo(){const deck=B.pickSel.slice();B=newB({kind:'tpl',key:'boss',seq:BOSS,si:0,st:bossStage(0),deck,intro:null});B.shadow=lastRun('boss');B.phase='look';B.bossTotals={wrong:{intel:0,gear:0,team:0,reason:0,do:0},hints:0,looks:0};render();},
  bossnext(){const t=B.bossTotals;Object.keys(t.wrong).forEach(k=>t.wrong[k]+=B.wrong[k]);t.hints+=B.hints;t.looks+=B.looks;
    const si=B.si+1,keep={deck:B.deck,t0:B.t0,shadow:B.shadow,bossTotals:t,log:B.log.concat([['info','进入第 '+(si+1)+' 阶段']]),newNotes:B.newNotes,planted:B.planted,recruited:B.recruited};
    B=newB(Object.assign({kind:'tpl',key:'boss',seq:BOSS,si,st:bossStage(si)},keep));B.phase='look';render();},
  // 菜园
  water(id){ui.water=id;ui.waterShow=false;render();},
  showans(){ui.waterShow=true;render();},
  rate(v){const id=ui.water,g=S.garden[id];v=Number(v);
    if(v===0){g.w=Math.min(5,g.w+1);g.last=today();gain(10,'浇水 · '+AT[id].name.replace(/\$/g,''),'water-'+id+'-'+today());see(id,'fail');if(g.w===2)toast(AT[id].kind==='知识'?'装备认证了':'情报记牢了');if(adv())setTimeout(()=>toast(VN.garden[(S.gN=(S.gN||0)+1)%VN.garden.length]),2800);}
    else{g.last=addDays(today(),-WATER[Math.min(g.w,WATER.length-1)]+1);if(v===2)see(id,'why');}
    ui.water=null;save();render();},
  // 训练场
  tbad(j){const p=D.packets[Math.min(ui.ti||0,D.packets.length-1)];ui.tans=Number(j);const ok=ui.tans===p.bad;
    if(!S.train[p.id]||S.train[p.id]!=='ok'){S.train[p.id]=ok?'ok':'miss';if(ok)gain(5,'训练场抓对一道','train-'+p.id);}save();render();},
  tnav(d){ui.ti=Math.max(0,Math.min(D.packets.length-1,(ui.ti||0)+Number(d)));ui.tans=undefined;render();},
  // 好友
  mkcode(){const f=ui.duel,p={k:+f.k,a:+f.a,m:+f.m,n:+f.n},t=f.t;const st=makeTpl(t,p);const a=num(f.ansA),b=num(f.ansB);
    if(a===null||b===null||Math.abs(a-st.ans[0])>1e-9||Math.abs(b-st.ans[1])>1e-9){f.err='你算的答案和题目对不上。出题人自己先要算对，题才算出得好。';f.code='';}
    else{const q=t==='D'?{t,m:p.m,n:p.n}:t==='B'?{t,k:p.k,a:p.a}:{t,k:p.k};f.code='QD1.'+btoa(JSON.stringify(q));f.err='';gain(10,'出了一道对的题','duel-made-'+f.code);}render();},
  copy(){const c=ui.duel&&ui.duel.code;if(!c)return;const sel=()=>{const el=$('#duel-code');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);};
    try{navigator.clipboard.writeText(c).then(()=>toast('复制好了'),()=>{sel();toast('已选中，按复制键');});}catch(e){sel();toast('已选中，按复制键');}},
  playcode(){const f=ui.duel;try{const s=f.inCode.trim();if(!s.startsWith('QD1.'))throw 0;const q=JSON.parse(atob(s.slice(4)));const p={k:+q.k,a:+q.a,m:+q.m,n:+q.n};
      if(!TPL[q.t]||!validTpl(q.t,p))throw 0;startTpl('duel',makeTpl(q.t,p));go('battle-duel',true);}catch(e){f.err='这个分享码读不出来。检查一下有没有漏字。';render();}},
  exam(){B={kind:'exam',key:'exam',ps:examProblems(),res:null};page='battle';cur='exam';render();window.scrollTo(0,0);}
};
function submit(){
  const st=B.st,a=num(B.inA),b=num(B.inB),two=st.labels.length>1;
  const okA=a!==null&&Math.abs(a-st.ans[0])<1e-9,okB=!two||(b!==null&&Math.abs(b-st.ans[1])<1e-9);
  if(okA&&okB){if(B.seq&&B.si<B.seq.length-1){B.log.push(['ok','第 '+(B.si+1)+' 影击退']);B.msg={k:'good',h:'第 '+(B.si+1)+' 影击退。'};B.phase='bossmid';render();return;}
    if(B.seq){const t=B.bossTotals;Object.keys(t.wrong).forEach(k=>B.wrong[k]+=t.wrong[k]);B.hints+=t.hints;B.looks+=t.looks;}
    win();}
  else{B.wrong.do++;B.log.push(['bad','结算没对上']);
    B.msg={k:'bad',h:okA&&two?esc(st.labels[0])+'对了，x 的值再看看。':okB&&two?'x 的值对了，'+esc(st.labels[0])+'再算算。':'没对上。再算一遍，或者要一步提示。'};}
  render();
}
function submitExam(){const ps=B.ps;B.vals=ps.flatMap((p,i)=>[$('#ex-'+i+'a').value,$('#ex-'+i+'b').value]);B.res=ps.map((p,i)=>{const a=num(B.vals[i*2]),b=num(B.vals[i*2+1]);return a!==null&&b!==null&&Math.abs(a-p.ans[0])<1e-9&&Math.abs(b-p.ans[1])<1e-9;});
  S.examTried=today();if(B.res.every(Boolean)){S.realm=Math.min(REALMS.length-1,S.realm+1);S.realmStart+=PER*5;S.capDate=null;S.xpLog.unshift({date:today(),n:0,why:'突破到 '+REALMS[S.realm]});if(S.realm===1)ui.scene=['breakthrough_斥候'];}save();render();}

/* ===== 路由与渲染（不靠 hash 也能走；能写 hash 时顺手写上） ===== */
function route(hh,force){
  const h=(hh!==undefined?hh:(location.hash||'').slice(1))||'title';
  if(h.startsWith('battle-')||h.startsWith('sweep-')){
    const sweep=h.startsWith('sweep-'),key=h.slice(sweep?6:7);
    if(sweep){if(!sweepable(key)){go('map');return;}startSweep(key);}
    else if(key==='duel'){if(!B||B.key!=='duel'){go('friends');return;}}
    else if(key==='boss'){if(!(cleared('p3')||S.unlockAll)){go('map');return;}if(force||!B||B.key!=='boss'){startBoss();ui.scene=['bossIn'];}}
    else if(key[0]==='p'){if(!['open','done'].includes(tplState(key))&&!S.unlockAll){go('map');return;}
      if(force||!B||B.key!==key||B.mode==='sweep'){const st={p1:makeTpl('A',{k:4}),p2:makeTpl('B',{k:9,a:1}),p3:makeTpl('C',{k:4})}[key];startTpl(key,st,{});B.phase='look';ui.scene=[key+'in'];}}
    else if(key[0]==='c'&&CARD[+key.slice(1)]){const c=CARD[+key.slice(1)];if(!stationOpen(STN[c.station])){go('map');return;}if(force||!B||B.key!==key||B.mode==='sweep')startCard(+key.slice(1));}
    else{go('map');return;}
    page='battle';
  }else{page=['title','map','deck','garden','train','notes','friends','record'].includes(h)?h:'title';B=null;}
  cur=h;ui.forge=null;render();window.scrollTo(0,0);
}
function go(h,force){try{if(location.hash.slice(1)!==h)location.hash=h;}catch(e){}route(h,force);}
function render(){
  L=LOOKS[S.look]||LOOKS.adv;renderTop();
  const f={title:pTitle,map:pMap,deck:pDeck,garden:pGarden,train:pTrain,notes:pNotes,friends:pFriends,record:pRecord,battle:pBattle}[page];
  $('#main').innerHTML=f();document.title=adv()?'罗盘指挥官':'学科罗盘 · 练习';
  if(page==='map'&&adv()&&cleared('p2')&&!S.seen['vn:fieldOpen']&&!(ui.scene&&ui.scene.length))ui.scene=['fieldOpen'];
  if(ui.scene&&ui.scene.length&&$('#vn').hidden){const q=ui.scene;ui.scene=null;setTimeout(()=>playScenes(q),60);}
  updateMusic();
}
document.addEventListener('click',e=>{
  if(S.music&&$('#bgm').paused)updateMusic();
  const l=e.target.closest('a[href^="#"]');if(l){e.preventDefault();go(l.getAttribute('href').slice(1));return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=ACT[b.dataset.act];if(a){e.preventDefault();a(b.dataset.arg);}});
document.addEventListener('submit',e=>{if(e.target.id==='do-form'){e.preventDefault();submit();}if(e.target.id==='exam-form'){e.preventDefault();submitExam();}});
document.addEventListener('input',e=>{const t=e.target;
  if(B&&t.id==='do-a')B.inA=t.value;if(B&&t.id==='do-b')B.inB=t.value;
  if(t.dataset&&t.dataset.duel){ui.duel[t.dataset.duel]=t.value;}
  if(t.dataset&&t.dataset.note){const id=t.dataset.note,n=noteOf(id);n.own=t.value;save();const seen=Object.keys(FIELD).filter(f=>n.seen[f]).length;
    if(n.own.trim().length>=4&&seen>=2)gain(10,'写下自己的话','own-'+id);
    const el=document.querySelector(`[data-badge="${CSS.escape(id)}"]`);if(el)el.innerHTML=n.own.trim().length>=4&&seen>=2?'<span class="chip ok">写下了自己的话</span>':`<span class="chip brass">看到 ${seen}/4</span>`;}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.duel&&t.tagName==='SELECT'){ui.duel[t.dataset.duel]=t.value;ui.duel.code='';ui.duel.err='';render();}});
$('#vn').addEventListener('click',e=>{e.stopPropagation();if(e.target.id==='vn-skip'){vnClose();return;}vnNext();});
document.addEventListener('keydown',e=>{if($('#vn').hidden)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();vnNext();}else if(e.key==='Escape')vnClose();});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'title';if(h!==cur)route(h);});
try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',renderTop);
route();
</script>
