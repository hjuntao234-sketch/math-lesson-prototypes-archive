<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-label="穿根数轴" font-family="inherit"><title>数轴上标 1、2、4，(x−1)(x−2)(x−4) 在四段上依次为负、正、负、正；4 是原分母的零点</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#566874"/></marker></defs><line x1="26" y1="92" x2="394" y2="92" stroke="#566874" stroke-width="1.4" marker-end="url(#ar)"/><line x1="125.0" y1="84" x2="125.0" y2="100" stroke="#1d2a33" stroke-width="1.8"/><text x="125.0" y="118.0" fill="#1d2a33" font-size="15" text-anchor="middle">1</text><line x1="181.7" y1="84" x2="181.7" y2="100" stroke="#1d2a33" stroke-width="1.8"/><text x="181.7" y="118.0" fill="#1d2a33" font-size="15" text-anchor="middle">2</text><line x1="295.0" y1="84" x2="295.0" y2="100" stroke="#1d2a33" stroke-width="1.8"/><text x="295.0" y="118.0" fill="#1d2a33" font-size="15" text-anchor="middle">4</text><text x="82.5" y="70.0" fill="#a83a34" font-size="24" text-anchor="middle">−</text><text x="153.3" y="70.0" fill="#17705f" font-size="24" text-anchor="middle">+</text><text x="238.3" y="70.0" fill="#a83a34" font-size="24" text-anchor="middle">−</text><text x="337.5" y="70.0" fill="#17705f" font-size="24" text-anchor="middle">+</text><text x="295.0" y="138.0" fill="#8a5d0c" font-size="13" text-anchor="middle">4：原分母为零</text><text x="210.0" y="22.0" fill="#1d2a33" font-size="14" text-anchor="middle">(x − 1)(x − 2)(x − 4) 在各段的正负</text></svg>