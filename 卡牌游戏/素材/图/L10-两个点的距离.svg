a5d0c" stroke-width="3"/><text x="115.0" y="18.0" fill="#566874" font-size="12" text-anchor="middle">x 在 1 和 3 之间</text></g><g transform="translate(476,0)"><line x1="12" y1="70" x2="218" y2="70" stroke="#566874" stroke-width="1.4" marker-end="url(#ar)"/><line x1="80.4" y1="65" x2="80.4" y2="75" stroke="#1d2a33" stroke-width="1.6"/><text x="80.4" y="90.0" fill="#1d2a33" font-size="13" text-anchor="middle">1</text><line x1="149.6" y1="65" x2="149.6" y2="75" stroke="#1d2a33" stroke-width="1.6"/><text x="149.6" y="90.0" fill="#1d2a33" font-size="13" text-anchor="middle">3</text><circle cx="184.3" cy="70" r="4.5" fill="#a83a34"/><text x="184.3" y="90.0" fill="#a83a34" font-size="14" text-anchor="middle" font-style="italic">x</text><line x1="184.3" y1="56" x2="80.4" y2="56" stroke="#17705f" stroke-width="3"/><line x1="184.3" y1="44" x2="149.6" y2="44" stroke="#8a5d0c" stroke-width="3"/><text x="115.0" y="18.0" fill="#566874" font-size="12" text-anchor="middle">x 在 3 右边</text></g><line x1="20" y1="132" x2="44" y2="132" stroke="#17705f" stroke-width="3"/><text x="50.0" y="137.0" fill="#17705f" font-size="13" text-anchor="start">|x − 1|：到 1 的距离</text><line x1="250" y1="132" x2="274" y2="132" stroke="#8a5d0c" stroke-width="3"/><text x="280.0" y="137.0" fill="#8a5d0c" font-size="13" text-anchor="start">|x − 3|：到 3 的距离</text></svg>