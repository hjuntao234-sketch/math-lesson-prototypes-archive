<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" role="img" aria-label="x 在 (0,2)，y 在 (0,1)" font-family="inherit"><title>x 的范围 (0,2)、y 的范围 (0,1)，两端都不取；分组取等要 x=1 在里面，要 y=1 却正好是不取的端点</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#566874"/></marker></defs><line x1="26" y1="66" x2="354" y2="66" stroke="#566874" stroke-width="1.4" marker-end="url(#ar)"/><text x="10.0" y="56.0" fill="#1d2a33" font-size="14" text-anchor="start" font-style="italic">x 的范围 (0, 2)</text><line x1="40.0" y1="66" x2="290.0" y2="66" stroke="#17705f" stroke-width="5" stroke-linecap="round"/><circle cx="40.0" cy="66" r="5.5" fill="#f6f2e8" stroke="#17705f" stroke-width="2"/><text x="40.0" y="86.0" fill="#1d2a33" font-size="13" text-anchor="middle">0</text><circle cx="290.0" cy="66" r="5.5" fill="#f6f2e8" stroke="#17705f" stroke-width="2"/><text x="290.0" y="86.0" fill="#1d2a33" font-size="13" text-anchor="middle">2</text><path d="M 159.0 40 L 165.0 54 L 171.0 40" fill="#8a5d0c"/><text x="165.0" y="34.0" fill="#8a5d0c" font-size="13" text-anchor="middle">分组要 x=1：在里面</text><line x1="26" y1="150" x2="354" y2="150" stroke="#566874" stroke-width="1.4" marker-end="url(#ar)"/><text x="10.0" y="140.0" fill="#1d2a33" font-size="14" text-anchor="start" font-style="italic">y 的范围 (0, 1)</text><line x1="40.0" y1="150" x2="165.0" y2="150" stroke="#17705f" stroke-width="5" stroke-linecap="round"/><circle cx="40.0" cy="150" r="5.5" fill="#f6f2e8" stroke="#17705f" stroke-width="2"/><text x="40.0" y="170.0" fill="#1d2a33" font-size="13" text-anchor="middle">0</text><circle cx="165.0" cy="150" r="5.5" fill="#f6f2e8" stroke="#17705f" stroke-width="2"/><text x="165.0" y="170.0" fill="#1d2a33" font-size="13" text-anchor="middle">1</text><path d="M 159.0 124 L 165.0 138 L 171.0 124" fill="#a83a34"/><text x="165.0" y="118.0" fill="#a83a34" font-size="13" text-anchor="middle">分组要 y=1：正好是不取的端点</t