<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罗盘指挥官 第一章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Long+Cang&family=ZCOOL+XiaoWei&family=Noto+Sans+Math&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
[hidden]{display:none!important}

/* 版式：1600×900 的固定舞台，按窗口等比缩放。借杀戮尖塔 2 的分区：通栏顶栏、左人右敌、左下心力球、底部扇形手牌、右下结束回合、右上题板。
   单一深色外观（游戏画面），所有颜色写在 :root。 */
:root{
  color-scheme:dark;
  --void:#0b100e; --slate:#24312c; --slate-2:#33433c; --slate-3:#4a5d54; --ink:#121815;
  --brass:#c49a4c; --brass-hi:#f1cf82; --brass-lo:#7a5a24;
  --paper:#efe5cb; --paper-2:#e2d5b4; --paper-ink:#2a251c;
  --text:#f1ebdc; --text-dim:#b9b3a3; --kw:#f4c862;
  --team:#b2483a; --team-hi:#e07a5f; --gear:#3b74a3; --gear-hi:#76aee0; --intel:#2c8a70; --intel-hi:#6cd2b2;
  --glow:#f6d27a; --seal:#b23a2c; --hp:#d24a37;
  --f-num:"Bree Serif","Noto Serif SC",Georgia,serif;
  --f-title:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-math:"STIX Two Math","Cambria Math","Noto Sans Math",math,serif;
  --outline:0 2px 0 #0b0f0d,2px 0 0 #0b0f0d,0 -2px 0 #0b0f0d,-2px 0 0 #0b0f0d,1.5px 1.5px 0 #0b0f0d,-1.5px 1.5px 0 #0b0f0d,1.5px -1.5px 0 #0b0f0d,-1.5px -1.5px 0 #0b0f0d,0 4px 6px rgba(0,0,0,.6);
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--f-body)}
math{font-family:var(--f-math)}
#shell{position:fixed;inset:0;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fit{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden;border-radius:6px;background:#2d3a33;box-shadow:0 0 0 1px #1d2622,0 20px 60px rgba(0,0,0,.6);user-select:none}
.abs{position:absolute}

/* 背景与调色 */
.bg{inset:0;background:url(img/bg-path.webp) center 40%/cover}
.grade{inset:0;background:
  linear-gradient(180deg,rgba(11,16,14,.78) 0,rgba(11,16,14,.15) 16%,rgba(11,16,14,0) 30%,rgba(11,16,14,0) 58%,rgba(11,16,14,.55) 80%,rgba(11,16,14,.92) 100%),
  radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);}
.ground{left:0;right:0;top:640px;height:90px;background:radial-gradient(60% 50% at 50% 50%,rgba(20,26,22,.35),transparent 70%)}

/* 顶栏 */
.topbar{left:0;top:0;width:1600px;height:84px;z-index:30}
.topbar>svg{position:absolute;inset:0}
.tb-row{position:absolute;left:0;right:0;top:0;height:62px;display:flex;align-items:center;gap:22px;padding:0 22px}
.tb-row .sp{flex:1}
.emb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3b4b44,#18211d);box-shadow:inset 0 0 0 2px var(--brass),inset 0 0 0 4px #121815,0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center}
.stat{display:flex;align-items:center;gap:8px}
.num{font-family:var(--f-num);color:var(--text);text-shadow:var(--outline);line-height:1}
.stat .num{font-size:28px}
.realm{display:grid;gap:4px}
.realm b{font-family:var(--f-title);font-weight:900;font-size:17px;letter-spacing:.06em;text-shadow:var(--outline)}
.xp{width:120px;height:8px;border-radius:4px;background:#121815;box-shadow:inset 0 0 0 1px #000,0 0 0 1px var(--brass-lo);overflow:hidden}
.xp i{display:block;height:100%;width:66%;background:linear-gradient(90deg,#c9963f,#f1cf82)}
.slots{display:flex;gap:6px;padding:6px 10px;border-radius:22px;background:#151d1a;box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 0 0 1px #3c4c45}
.slot{width:30px;height:38px;border-radius:5px;border:1.5px dashed #56675f;display:grid;place-items:center}
.slot.full{border:1.5px solid var(--brass);background:linear-gradient(#2c3f55,#1b2838);box-shadow:0 0 8px rgba(118,174,224,.35)}
.slot.full span{font-family:var(--f-math);font-size:12px;color:#dbe9f6}
.stage-lbl{display:grid;gap:2px;text-align:left}
.stage-lbl small{font-size:12px;color:var(--text-dim);letter-spacing:.12em}
.stage-lbl b{font-family:var(--f-title);font-weight:900;font-size:18px;text-shadow:var(--outline)}
.ibtn{position:relative;width:46px;height:46px;display:grid;place-items:center;border-radius:8px;cursor:pointer;transition:transform .15s}
.ibtn:hover{transform:translateY(-2px) scale(1.06)}
.ibtn .cnt{position:absolute;right:-4px;bottom:-4px;font-family:var(--f-num);font-size:18px;color:var(--text);text-shadow:var(--outline)}
.relics{position:absolute;left:24px;top:70px;display:flex;gap:10px}
.relic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#3a4a43,#1b2420);box-shadow:0 0 0 1.5px var(--brass-lo),0 2px 4px rgba(0,0,0,.6)}

/* 人物 */
.mate{bottom:260px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
.mate.back{filter:brightness(.72) saturate(.85) drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.shadow{height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
.rib{display:flex;align-items:center;gap:8px;transform:translateX(-50%);white-space:nowrap}
.rib .nm{font-family:var(--f-title);font-weight:900;font-size:17px;padding:3px 14px 4px 12px;background:linear-gradient(#1c2522,#121815);border:1.5px solid var(--brass-lo);border-left:5px solid var(--c);border-radius:3px;text-shadow:0 1px 0 #000;box-shadow:0 3px 6px rgba(0,0,0,.5)}
.rib .nm small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--text-dim);margin-left:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(18,24,21,.85);border:1px solid #4b5c54;color:var(--text-dim)}
.chip.on{border-color:var(--glow);color:var(--glow)}

/* 气泡 */
.bub{background:var(--paper);color:var(--paper-ink);font-family:var(--f-title);font-weight:700;font-size:17px;line-height:1.55;padding:12px 16px 13px;border-radius:16px;box-shadow:0 0 0 2px #2a251c,0 6px 14px rgba(0,0,0,.5);z-index:12}
.bub::after{content:"";position:absolute;bottom:-14px;left:var(--tail,40px);width:22px;height:16px;background:var(--paper);clip-path:polygon(0 0,100% 0,15% 100%);filter:drop-shadow(0 2px 0 #2a251c)}
.bub small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:#7a6e58;letter-spacing:.08em;margin-bottom:2px}
.bub.quiet{background:var(--paper-2);font-size:15.5px;opacity:.94}
.bub.quiet::after{background:var(--paper-2)}

/* 守卫 */
.guard{left:1060px;top:318px;width:400px;height:365px;z-index:5;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.tag{background:var(--paper);color:var(--paper-ink);font-size:15px;padding:2px 9px;border-radius:4px;box-shadow:0 0 0 1.5px #2a251c,0 3px 6px rgba(0,0,0,.45);white-space:nowrap;z-index:6}
.tag::before{content:"";position:absolute;left:50%;top:-14px;width:1.5px;height:14px;background:#2a251c}
.tag.cloth{background:#d9cdae;font-family:var(--f-body);font-size:13px}
.tag.cloth::before{display:none}
.brk{width:26px;height:26px;border:3px solid var(--glow);filter:drop-shadow(0 0 4px rgba(246,210,122,.8));z-index:6}
.intent{left:968px;top:330px;display:flex;align-items:center;gap:6px;z-index:7;cursor:help}
.intent .num{font-size:26px}
.intent .why{font-size:13px;color:var(--text);background:rgba(12,17,15,.82);padding:3px 9px;border-radius:4px;border:1px solid #4b5c54}
.coat{left:1100px;top:694px;width:320px;z-index:8}
.coat-row{display:flex;align-items:center;gap:8px}
.weak{width:30px;height:30px;display:grid;place-items:center;font-family:var(--f-title);font-weight:900;font-size:15px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.weak.k{background:#e3922b;color:#241404}
.weak.q{background:#2b3732;color:#9aa8a1}
.bar{flex:1;height:22px;display:flex;gap:3px;padding:3px;background:#0d1210;border-radius:4px;box-shadow:0 0 0 1.5px #000,0 0 0 3px #5d6d65}
.bar i{flex:1;border-radius:2px;background:linear-gradient(#ffffff,#c9d3cf 60%,#9aa9a3);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.coat .num{position:absolute;left:50%;top:-1px;transform:translateX(-50%);font-size:21px;pointer-events:none}
.coat .lbl{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--text-dim)}

/* 题板 */
.board{right:22px;top:84px;width:420px;z-index:20;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:12px 18px 12px;box-shadow:0 0 0 2px #2a251c,0 0 0 5px var(--brass-lo),0 12px 26px rgba(0,0,0,.55);
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(76,92,82,.13) 27px 28px)}
.board::before,.board::after{content:"";position:absolute;width:16px;height:16px;border:2.5px solid var(--brass);top:-7px}
.board::before{left:-7px;border-right:0;border-bottom:0}.board::after{right:-7px;border-left:0;border-bottom:0}
.board h3{margin:0;display:flex;align-items:baseline;gap:8px;font-family:var(--f-title);font-weight:900;font-size:19px}
.board h3 small{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:#7a6e58}
.board .q{font-family:var(--f-title);font-weight:700;font-size:17px;margin:6px 0 6px;line-height:1.6}
.board ul{list-style:none;margin:0;padding:6px 0 0;border-top:1.5px solid rgba(42,37,28,.35);display:grid;gap:3px;font-size:14.5px}
.board li{display:grid;grid-template-columns:22px 1fr;align-items:baseline}
.board li b{font-family:var(--f-title);color:var(--seal)}
.board li.todo{color:#8a7f69}
.board li.todo b{color:#8a7f69}

/* 心力球、牌堆、结束回合 */
.orb{left:28px;top:650px;width:150px;height:150px;z-index:25}
.orb .num{position:absolute;inset:0;display:grid;place-items:center;font-size:38px}
.orb .cap{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-family:var(--f-title);font-weight:900;font-size:15px;letter-spacing:.3em;text-shadow:var(--outline)}
.pile{width:62px;height:62px;z-index:25;cursor:pointer}
.pile .cnt{position:absolute;right:-6px;bottom:-4px;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-num);font-size:17px;color:#fff;background:#9a2f22;box-shadow:0 0 0 2px #0b0f0d}
.pile.dis .cnt{background:#2e5f8a}
.endturn{right:96px;top:772px;width:236px;height:72px;z-index:25;cursor:pointer;padding:3px;background:linear-gradient(var(--brass-hi),var(--brass-lo));clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%);transition:filter .15s,transform .15s;border:0}
.endturn span{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(#3e5249,#22302a 60%,#1a2521);clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%);font-family:var(--f-title);font-weight:900;font-size:24px;letter-spacing:.12em;color:var(--text);text-shadow:var(--outline)}
.endturn:hover{filter:brightness(1.15);transform:translateY(-2px)}

/* 手牌 */
.hand{left:0;top:0;width:1600px;height:900px;z-index:40;pointer-events:none}
.card{position:absolute;width:190px;height:266px;transform-origin:50% 120%;transition:transform .18s ease,filter .18s;pointer-events:auto;cursor:pointer}
.card .hk{position:absolute;left:0;right:0;top:-34px;text-align:center;font-size:24px}
.frame{position:absolute;inset:0;border-radius:14px;background:linear-gradient(170deg,#2d3a34,#18201c 70%);box-shadow:0 0 0 3px #0b0f0d,inset 0 0 0 2px var(--trim),inset 0 0 0 6px rgba(0,0,0,.35),0 12px 22px rgba(0,0,0,.55);overflow:visible}
.card.play .frame{box-shadow:0 0 0 3px #0b0f0d,0 0 0 5px rgba(246,210,122,.85),0 0 22px rgba(246,210,122,.45),inset 0 0 0 2px var(--trim),inset 0 0 0 6px rgba(0,0,0,.35),0 12px 22px rgba(0,0,0,.55)}
.frame::before,.frame::after{content:"";position:absolute;width:12px;height:12px;background:var(--brass);transform:rotate(45deg);bottom:-6px;box-shadow:0 0 0 2px #0b0f0d}
.frame::before{left:24px}.frame::after{right:24px}
.cost{position:absolute;left:-12px;top:-12px;width:48px;height:48px;display:grid;place-items:center;z-index:3;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:#0b0f0d}
.cost::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:radial-gradient(circle at 40% 30%,var(--brass-hi),var(--brass) 55%,var(--brass-lo))}
.cost .num{position:relative;font-size:27px}
.ttl{position:absolute;left:16px;right:8px;top:9px;height:34px;display:grid;place-items:center;font-family:var(--f-title);font-weight:900;font-size:17.5px;color:#fbf3df;text-shadow:0 1.5px 0 #000,0 0 6px rgba(0,0,0,.6);background:linear-gradient(180deg,var(--trim-hi),var(--trim) 55%,color-mix(in srgb,var(--trim) 70%,#000));clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);z-index:2;letter-spacing:.04em}
.art{position:absolute;left:14px;right:14px;top:50px;height:112px;overflow:hidden;box-shadow:0 0 0 2px #0b0f0d,0 0 0 3.5px var(--brass-lo)}
.team .art{border-radius:70px 70px 6px 6px}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.gear .art{border-radius:4px;background:linear-gradient(#e9dfc4,#d8cba7);display:grid;place-items:center;color:#1f2f40}
.gear .art math{font-size:24px}
.intel .art{border-radius:6px;background:radial-gradient(circle,#efe5cb 55%,#ddd0ad);display:grid;place-items:center}
.seal{width:84px;height:84px;border-radius:50%;border:4px double var(--seal);color:var(--seal);display:grid;place-items:center;transform:rotate(-10deg);font-size:20px}
.body{position:absolute;left:12px;right:12px;top:170px;bottom:30px;display:grid;place-items:center;text-align:center;font-size:13px;line-height:1.5;font-weight:500;color:var(--text)}
.body .kw{color:var(--kw);font-weight:700}
.type{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;white-space:nowrap;padding:1px 10px;border-radius:9px;background:#0f1412;border:1px solid var(--brass-lo);color:var(--text-dim)}
.team{--trim:var(--team);--trim-hi:var(--team-hi)}
.gear{--trim:var(--gear);--trim-hi:var(--gear-hi)}
.intel{--trim:var(--intel);--trim-hi:var(--intel-hi)}
.tips{position:absolute;left:calc(100% + 14px);top:0;width:236px;display:none;gap:8px;pointer-events:none}
.card.left .tips{left:auto;right:calc(100% + 14px)}
.tip{background:rgba(16,22,19,.96);border:1px solid #56675f;border-radius:6px;padding:8px 11px 9px;font-size:12.5px;line-height:1.55;color:var(--text);box-shadow:0 6px 14px rgba(0,0,0,.5)}
.tip b{display:block;color:var(--kw);font-family:var(--f-title);font-weight:900;font-size:14px;margin-bottom:1px}
.card.hot{z-index:60}
.card.hot .tips{display:grid}
.card.fly{transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s;opacity:0}

.toast{left:50%;top:380px;transform:translate(-50%,0);z-index:70;font-family:var(--f-title);font-weight:900;font-size:30px;letter-spacing:.06em;color:var(--text);text-shadow:var(--outline);opacity:0;transition:opacity .2s,transform .4s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,-14px)}

/* 标注 */
#noteBtn{font-family:var(--f-title);font-weight:900;font-size:14px;color:#1a140a;background:var(--glow);border:0;border-radius:18px;padding:7px 14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#noteBtn:focus-visible,.endturn:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pin{width:34px;height:34px;border-radius:50%;display:none;place-items:center;font-family:var(--f-num);font-size:19px;color:#1a140a;background:var(--glow);box-shadow:0 0 0 3px #0b0f0d,0 0 14px rgba(246,210,122,.8);z-index:90}
.noting .pin{display:grid}
#notes{position:fixed;z-index:99;top:0;right:0;bottom:0;width:min(400px,92vw);overflow:auto;background:rgba(14,19,17,.97);border-left:1px solid #3c4c45;padding:58px max(20px,env(safe-area-inset-right,0px)) 28px 22px;font-size:14px;line-height:1.7;color:var(--text)}
#noteClose{position:absolute;top:16px;right:max(20px,env(safe-area-inset-right,0px));font-family:var(--f-title);font-weight:900;font-size:13px;color:#1a140a;background:var(--glow);border:0;border-radius:16px;padding:5px 12px;cursor:pointer}
#noteClose:focus-visible{outline:3px solid #fff;outline-offset:2px}
#notes h2{font-family:var(--f-title);font-weight:900;font-size:20px;margin:0 0 4px}
#notes p.lead{color:var(--text-dim);margin:0 0 14px;font-size:13.5px}
#notes ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:n}
#notes li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:6px}
#notes li::before{content:counter(n);font-family:var(--f-num);font-size:17px;color:#1a140a;background:var(--glow);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:2px}
#notes b{color:var(--kw)}
#notes .new{display:inline-block;font-size:11.5px;color:#1a140a;background:#e9a35a;border-radius:8px;padding:0 6px;margin-left:4px}
#notes .foot{margin-top:18px;color:var(--text-dim);font-size:12.5px}
@media (prefers-reduced-motion:reduce){.guard{animation:none}.card,.toast{transition:none}}

/* ===== 四屏合页：页面顶上的切换条 ===== */
#chrome{position:fixed;z-index:120;left:0;right:0;top:0;height:48px;display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);background:#0b100e;border-bottom:1px solid #1f2a26}
#chrome .tabs{display:flex;gap:4px}
#chrome a{font-family:var(--f-title);font-weight:900;font-size:15px;color:var(--text-dim);text-decoration:none;padding:6px 14px;border-radius:16px}
#chrome a[aria-current="page"]{color:#1a140a;background:var(--glow)}
#chrome a:focus-visible{outline:2px solid #fff;outline-offset:2px}
#chrome .sp{flex:1}
#chrome .hint{font-size:12.5px;color:var(--text-dim)}
#shell{top:calc(48px + env(safe-area-inset-top,0px))}
.scr[hidden]{display:none!important}
.ibtn.on{background:rgba(246,210,122,.16);box-shadow:0 0 0 1.5px var(--brass)}

/* ===== 地图 ===== */
.mapback{inset:0;background:url(img/bg-path.webp) center/cover;filter:blur(6px) brightness(.38) saturate(.7);transform:scale(1.05)}
.mapsvg{left:24px;top:70px;width:1296px;height:822px;overflow:visible}
.mapsvg text{font-family:var(--f-title);font-weight:700;fill:#3b2f20}
.node{cursor:pointer}
.node .ring{fill:none}
.node.open .ring{stroke:var(--glow);stroke-width:3;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25;stroke-width:7}}
.node.fog{opacity:.32;cursor:default}
.node:hover .ico{transform:scale(1.12)}

/* ===== 领主裂开 ===== */
.bsbg{inset:0;background:url(img/bg-boss.webp) center/cover;filter:saturate(.8) brightness(.8)}
.bsgrade{inset:0;background:linear-gradient(180deg,rgba(11,16,14,.75) 0,rgba(11,16,14,.1) 18%,rgba(11,16,14,.1) 55%,rgba(11,16,14,.88) 100%),radial-gradient(70% 60% at 66% 40%,rgba(120,90,150,.18),transparent 70%)}
.bsmode{right:36px;top:96px;z-index:20;display:flex;gap:4px;padding:4px;border-radius:20px;background:rgba(12,17,15,.8);border:1px solid #3c4c45}
.bmode{font-family:var(--f-title);font-weight:900;font-size:14px;color:var(--text-dim);background:none;border:0;border-radius:16px;padding:5px 12px;cursor:pointer}
.bmode.on{color:#1a140a;background:var(--glow)}
.bmode:focus-visible{outline:2px solid #fff}
.bboard{left:36px;top:96px;width:560px;z-index:20;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 20px 16px;box-shadow:0 0 0 2px #2a251c,0 0 0 5px var(--brass-lo),0 12px 26px rgba(0,0,0,.55);
  background-image:repeating-linear-gradient(0deg,transparent 0 29px,rgba(76,92,82,.13) 29px 30px)}
.bboard h3{margin:0;display:flex;align-items:baseline;gap:8px;font-family:var(--f-title);font-weight:900;font-size:20px}
.bboard h3 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:#7a6e58}
.bboard .q{font-family:var(--f-title);font-weight:700;font-size:19px;margin:8px 0 4px;line-height:1.7}
.bslots{display:grid;gap:7px;margin-top:8px;padding-top:8px;border-top:1.5px solid rgba(42,37,28,.35)}
.bslot{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;min-height:46px;border:2px dashed #8a7f69;border-radius:5px;padding:4px 8px;background:rgba(255,255,255,.3);cursor:pointer}
.bslot b{font-family:var(--f-title);font-size:14px;color:#7a6e58}
.bslot.on{border-style:solid;border-color:#2a251c;background:#f7efd9}
.bslot.ok{border-color:#2f6b45;background:#e6f0dc}
.bslot.bad{border-color:#c0392b;background:#f8e0dc;animation:shake .4s}
.bslot.next{border-color:var(--brass);box-shadow:0 0 0 2px rgba(196,154,76,.35)}
.bslot .line{grid-column:2;font-size:14.5px;color:#2f4a3a;margin-top:2px}
.btray{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1.5px solid rgba(42,37,28,.35)}
.bcard{display:grid;gap:1px;width:calc(50% - 4px);align-content:start;text-align:left;padding:5px 10px 6px 12px;border:2px solid #2a251c;border-left:6px solid var(--c);border-radius:4px;background:#fbf4e2;color:#2a2620;font-size:14px;line-height:1.45;cursor:pointer;box-shadow:3px 3px 0 #2a251c}
.bcard small{font-family:var(--f-title);font-weight:900;font-size:12px;color:var(--c)}
.bcard:hover,.bcard:focus-visible{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #2a251c;outline:none;background:#fffaf0}
.bcard.used{opacity:.3;pointer-events:none;box-shadow:none}
.boss{left:820px;top:130px;width:500px;height:500px;z-index:5;animation:float 7s ease-in-out infinite;transition:opacity 1.2s,transform .6s}
.boss #cracks path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease-out}
.boss.cracked #cracks path{stroke-dashoffset:0}
.boss.cracked #shadows{opacity:0;transition:opacity .4s .5s}
.boss.split{opacity:.42;transform:scale(.92)}
.boss.hit{animation:ghit .45s}
.boss.gone{opacity:0;filter:blur(10px)}
.mn{position:absolute;z-index:8;width:170px;display:grid;justify-items:center;gap:4px;transition:left .8s cubic-bezier(.3,1.4,.5,1),top .8s cubic-bezier(.3,1.4,.5,1),opacity .6s,transform .6s;cursor:pointer;background:none;border:0;padding:0;color:inherit;font:inherit}
.mn svg{width:150px;height:150px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));animation:float 5s ease-in-out infinite}
.mn .mlab{font-family:var(--f-title);font-weight:900;font-size:15px;padding:3px 10px;border-radius:4px;background:rgba(14,19,17,.88);border:1.5px solid var(--c);color:var(--text);white-space:nowrap}
.mn .mst{font-size:12.5px;color:var(--text-dim)}
.mn.faint{opacity:.32;pointer-events:none}
.mn.now svg{filter:drop-shadow(0 0 14px var(--c)) drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.mn.down{opacity:.0;transform:translateY(20px) scale(.6);pointer-events:none}
.mn:focus-visible .mlab{outline:2px solid #fff}
.bpanel{left:620px;right:36px;top:640px;z-index:30;min-height:120px;max-height:168px;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:12px 20px 14px;box-shadow:0 0 0 2px #2a251c,0 0 0 5px var(--brass-lo),0 12px 26px rgba(0,0,0,.55);
  background-image:repeating-linear-gradient(0deg,transparent 0 29px,rgba(76,92,82,.12) 29px 30px)}
.bpanel h5{margin:0 0 6px;font-family:var(--f-title);font-weight:900;font-size:18px;display:flex;gap:10px;align-items:baseline}
.bpanel h5 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:#7a6e58}
.bpanel p{margin:0 0 6px;font-size:16px;line-height:1.6}
.bpanel .qbtns{gap:8px}
.bpanel .qbtn{font-size:15px;padding:6px 13px}
.bpanel .say{margin-top:6px;font-size:14.5px;color:#4a4334}
.bpanel .say.bad{color:#a3271f}
.bpanel .say.good{color:#2f6b45}
.bpanel.wide{left:36px;top:96px;max-height:none}
.binput{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-title);font-weight:700;font-size:18px}
.binput input{width:64px;height:38px;font-family:var(--f-num);font-size:21px;text-align:center;border:2px solid #2a251c;border-radius:4px;background:#fffaf0;color:#2a251c}
.binput input:focus{outline:3px solid var(--brass)}
.bflash{left:0;top:0;width:1600px;height:900px;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(420px 360px at 66% 42%,rgba(255,246,214,.95),rgba(255,236,180,.3) 45%,transparent 72%)}
.bflash.on{animation:flash 1s ease-out}
.btalk{left:36px;right:36px;bottom:12px;height:62px;z-index:35}
.btalk .xline.old{display:none}
.rep{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;font-size:15.5px;line-height:1.6;color:#2a2620}
.rep h6{margin:0 0 4px;font-family:var(--f-title);font-weight:900;font-size:16px}
.rep ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.rep .st{display:inline-block;min-width:54px;text-align:center;font-family:var(--f-title);font-weight:900;font-size:13px;padding:0 7px;border-radius:3px;margin-right:6px}
.rep .s1{background:#dcefe3;color:#24704a}.rep .s2{background:#f4e8d0;color:#8a5f12}.rep .s3{background:#f8e0dc;color:#a3271f}
.rep .verdict{grid-column:1/-1;padding:10px 14px;border-left:5px solid #b23a2c;background:rgba(178,58,44,.07);font-family:var(--f-title);font-weight:700;font-size:17px}
.rep .teach{font-family:"ZCOOL XiaoWei",var(--f-title);font-size:15px;color:#b23a2c;border:2.5px double #b23a2c;padding:0 8px;transform:rotate(-4deg);display:inline-block}
@media (prefers-reduced-motion:reduce){.boss,.mn svg{animation:none}}

/* ===== v6：GPT 画的守卫分层 ===== */
.guard2{left:930px;top:236px;width:510px;height:468px;z-index:6;filter:drop-shadow(0 0 1.6px rgba(28,44,40,.85)) drop-shadow(0 0 12px rgba(20,32,30,.45)) drop-shadow(0 14px 14px rgba(0,0,0,.35))}
.guard2.dissolve{filter:blur(8px);opacity:0}
.guard2 img{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.guard2 #armL,.guard2 #armLe{transform-origin:306px 212.5px}
.guard2 #armS,.guard2 #armSe{transform-origin:306px 297.5px}
.guard2 .arm{transition:transform .9s cubic-bezier(.4,1.4,.5,1),opacity .6s}
.guard2 .eq{opacity:0}
.guard2 #gEyes{transform-origin:50% 136px;animation:gblink 5s infinite}
@keyframes gblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.guard2 #cloth{transition:transform 1s ease-in,opacity 1s}
.guard2.hit #gEyes{animation:none;transform:scaleY(.2)}
@media (prefers-reduced-motion:reduce){.guard2 #gEyes{animation:none}}

/* ===== 改条件（菜园） ===== */
.gdbg{inset:0;background:url(img/bg-garden.webp) center/cover;filter:saturate(.85) brightness(.75)}
.gdgrade{inset:0;background:linear-gradient(180deg,rgba(11,16,14,.6) 0,rgba(11,16,14,.05) 18%,rgba(11,16,14,.1) 60%,rgba(11,16,14,.85) 100%)}
.gdpaper{left:40px;top:96px;width:600px;height:700px;box-sizing:border-box;background:#efe6cf;color:#2a2620;border-radius:4px;padding:18px 24px;box-shadow:0 0 0 2px #2a2f2a,0 14px 30px rgba(0,0,0,.5);overflow:hidden;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(76,92,82,.14) 31px 32px)}
.gdpaper::before{content:"";position:absolute;left:50%;top:-11px;width:120px;height:24px;margin-left:-60px;background:repeating-linear-gradient(45deg,rgba(92,150,56,.55) 0 7px,rgba(92,150,56,.38) 7px 14px);transform:rotate(-2deg)}
.gdorig{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-top:10px;padding-bottom:12px;border-bottom:1.5px solid rgba(42,37,28,.35)}
.gdmini{position:relative;width:150px;height:138px;border-radius:6px;background:radial-gradient(circle at 50% 70%,rgba(92,150,56,.35),transparent 70%)}
.gdmini img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 1.2px rgba(28,44,40,.9))}
.gdq{margin:0;font-family:var(--f-title);font-weight:700;font-size:18px;line-height:1.7}
.gdans{margin:6px 0 0;font-size:15px}
.gdcond{display:inline-block;padding:0 8px;border-radius:4px;background:#ffe08a;box-shadow:0 0 0 1.5px #b88a2e}
.gdnow{margin-top:12px;font-family:var(--f-title);font-weight:700;font-size:19px;line-height:1.7;min-height:40px}
.gdnow .gdcond{background:#cfe8bf;box-shadow:0 0 0 1.5px #5c9638}
.gdh{margin:14px 0 6px;font-family:"ZCOOL XiaoWei",var(--f-title);font-weight:400;font-size:19px;color:#4a4334}
.gdlog{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.gdlog li{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:5px 10px;border-radius:4px;background:rgba(255,255,255,.45);border:1px solid rgba(42,37,28,.2)}
.gdlog li b{font-family:var(--f-title)}
.gdlog .ok{color:#2f6b45;font-weight:700}.gdlog .no{color:#a3271f;font-weight:700}
.gdlog li.mine{background:rgba(207,232,191,.55)}
.gdgraph{left:656px;top:96px;width:904px;height:420px;background:#efe6cf;border-radius:4px;box-shadow:0 0 0 2px #2a2f2a,0 14px 30px rgba(0,0,0,.5);padding:12px 14px 6px;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(76,92,82,.12) 31px 32px)}
.gdgraph svg{width:100%;height:100%;display:block}
.gdgraph text{font-family:var(--f-num);font-size:14px;fill:#6b604c}
.gdgraph .ttl{font-family:"ZCOOL XiaoWei",var(--f-title);font-size:17px;fill:#4a4334}
.gdtask{left:656px;top:534px;width:904px;height:262px;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 22px;box-shadow:0 0 0 2px #2a251c,0 0 0 5px var(--brass-lo),0 12px 26px rgba(0,0,0,.55);overflow:auto;
  background-image:repeating-linear-gradient(0deg,transparent 0 29px,rgba(76,92,82,.12) 29px 30px)}
.gdtask h5{margin:0 0 8px;font-family:var(--f-title);font-weight:900;font-size:19px;display:flex;gap:10px;align-items:baseline}
.gdtask h5 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:#7a6e58}
.gdtask p{margin:0 0 8px;font-size:16px;line-height:1.6}
.gdtask .qbtns{gap:9px}
.gdtask .qbtn{font-size:16px;padding:7px 14px}
.gdtask .say{margin-top:8px;font-size:15px;color:#4a4334}
.gdtask .say.bad{color:#a3271f}.gdtask .say.good{color:#2f6b45}
.gdtask .binput input{width:90px}
.gdpick{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-family:var(--f-title);font-weight:700;font-size:18px;margin-bottom:8px}
.gdseg{display:flex;gap:4px}
.gdseg button{min-width:44px;height:38px;font-family:var(--f-num);font-size:19px;border:2px solid #2a251c;background:#f7efd9;color:#2a251c;border-radius:4px;cursor:pointer}
.gdseg button.on{background:#2a2f2a;color:#f1e8d0}
.gdseg button:focus-visible{outline:3px solid var(--brass)}
.gdtalk{left:40px;right:40px;bottom:12px;height:62px;z-index:35}
.gdtalk .xline.old{display:none}

/* ===== 遗迹 ===== */
.rnbg{inset:0;background:url(img/bg-ruins.webp) center/cover;filter:saturate(.8) brightness(.62)}
.rngrade{inset:0;background:linear-gradient(180deg,rgba(11,16,14,.7) 0,rgba(11,16,14,.15) 20%,rgba(11,16,14,.2) 60%,rgba(11,16,14,.9) 100%)}
.rnbook{left:40px;top:96px;width:540px;height:704px;box-sizing:border-box;background:#efe6cf;color:#2a2620;border-radius:4px;padding:18px 22px;box-shadow:0 0 0 2px #2a2f2a,0 14px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(76,92,82,.14) 31px 32px)}
.rnbook::before{content:"";position:absolute;left:50%;top:-11px;width:120px;height:24px;margin-left:-60px;background:repeating-linear-gradient(45deg,rgba(110,90,140,.55) 0 7px,rgba(110,90,140,.38) 7px 14px);transform:rotate(-2deg)}
.rnvisit{margin:6px 0 8px;font-size:14px;color:#6b604c}
.rnmap{margin:0;padding:0;list-style:none;display:grid;gap:5px;overflow:auto}
.rnmap li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:5px 10px;border-radius:4px;border:1.5px solid rgba(42,37,28,.22);background:rgba(255,255,255,.4);font-size:15px}
.rnmap li.side{margin-left:26px;font-size:14px}
.rnmap li.cur{border-color:#b0853a;background:#fbf1d4;box-shadow:0 0 0 2px rgba(196,154,76,.35)}
.rnmap li.lock{opacity:.45}
.rnmap li button{all:unset;cursor:pointer}
.rnmap li button:focus-visible{outline:2px solid var(--brass)}
.rnmap .ic{font-family:var(--f-title);font-weight:900;font-size:16px;text-align:center}
.rnmap .ok .ic,.rnmap li.ok .ic{color:#2f6b45}
.rnmap .tag{font-family:var(--f-title);font-weight:900;font-size:12px;padding:0 7px;border-radius:3px;white-space:nowrap}
.rnmap .t-dead{color:#a3271f;border:2px double #a3271f;transform:rotate(-4deg)}
.rnmap .t-q{color:#5b4f8a;border:2px double #5b4f8a}
.rnmap .t-ok{color:#2f6b45}
.rnmap .t-ev{color:#8a5f12;border:2px double #8a5f12}
.rnfoot{margin-top:auto;padding-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.rnfoot .qbtn{font-size:14px;padding:6px 12px}
.rnroom{left:604px;top:96px;width:956px;height:704px;box-sizing:border-box;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:20px 28px;box-shadow:0 0 0 2px #2a251c,0 0 0 5px var(--brass-lo),0 12px 26px rgba(0,0,0,.55);overflow:auto;
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(76,92,82,.12) 31px 32px)}
.rnroom h5{margin:0 0 4px;font-family:var(--f-title);font-weight:900;font-size:24px;display:flex;align-items:baseline;gap:12px}
.rnroom h5 small{font-family:var(--f-body);font-weight:500;font-size:14px;color:#7a6e58}
.rnroom p{margin:0 0 10px;font-size:17px;line-height:1.75}
.rnroom .qbtns{gap:10px;margin:6px 0}
.rnroom .qbtn{font-size:16px;padding:8px 15px}
.rnroom .say{margin-top:8px;font-size:15.5px;line-height:1.65;color:#4a4334}
.rnroom .say.bad{color:#a3271f}.rnroom .say.good{color:#2f6b45}
.rntab{margin:6px 0 12px;padding:12px 16px;border-left:5px solid #7a6a9a;background:rgba(110,90,140,.08);font-size:16px;line-height:1.75}
.rntab b{font-family:var(--f-title)}
.rndef{margin:4px 0 12px;padding:8px 14px;border:1.5px dashed #8a7f69;border-radius:4px;font-size:15px;line-height:1.7}
.rndirs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.rndir{border:2px solid #2a251c;border-radius:5px;background:#fbf4e2;padding:10px 14px;display:grid;gap:6px;box-shadow:3px 3px 0 #2a251c}
.rndir h6{margin:0;font-family:var(--f-title);font-weight:900;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.rndir p{margin:0;font-size:15px;line-height:1.6}
.rndir .walk{font-size:14.5px;line-height:1.65;color:#3d382d;border-top:1.5px dashed rgba(42,37,28,.3);padding-top:6px}
.rndir .qbtns{margin:0}
.rndir .qbtn{font-size:14.5px;padding:5px 11px}
.rndir.dead{background:#f3e3dd}.rndir.q{background:#ece8f3}.rndir.ev{background:#f6ecd6}.rndir.go{background:#e6f0dc}
.rnchain{margin:8px 0 12px;padding:10px 16px;border-radius:4px;background:rgba(42,37,28,.05);border:1.5px solid rgba(42,37,28,.2);font-size:18px;line-height:2}
.rnchain .done{color:#2f6b45}
.rnstamp{display:inline-block;font-family:var(--f-title);font-weight:900;font-size:16px;padding:0 10px;margin-left:6px;transform:rotate(-5deg);animation:stamp .4s ease}
.rnstamp.dead{color:#a3271f;border:3px double #a3271f}.rnstamp.q{color:#5b4f8a;border:3px double #5b4f8a}.rnstamp.ok{color:#2f6b45;border:3px double #2f6b45}.rnstamp.ev{color:#8a5f12;border:3px double #8a5f12}
.rnbadges{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.rnbadge{display:grid;justify-items:center;gap:2px;padding:8px 12px;border-radius:6px;border:2px solid #2a251c;background:#fbf4e2;min-width:120px;text-align:center;font-size:13.5px}
.rnbadge b{font-family:var(--f-title);font-size:16px}
.rnbadge i{font-style:normal;font-size:26px;line-height:1}
.rnmove{margin:8px 0;padding:10px 14px;border-left:5px solid #b0853a;background:rgba(196,154,76,.1);font-family:var(--f-title);font-weight:700;font-size:17px;line-height:1.8}
.rntalk{left:40px;right:40px;bottom:12px;height:62px;z-index:35}
.rntalk .xline.old{display:none}

/* ===== v6 引擎新增 ===== */
.lstrip{left:50%;top:74px;transform:translateX(-50%);margin:0;padding:4px;list-style:none;display:flex;gap:4px;z-index:22;background:rgba(12,17,15,.78);border-radius:20px;border:1px solid #3c4c45}
.lstrip li{display:flex;align-items:baseline;gap:5px;font-family:var(--f-title);font-weight:900;font-size:14px;padding:4px 12px;border-radius:15px;color:#6f7f78;white-space:nowrap}
.lstrip li small{font-family:var(--f-body);font-weight:500;font-size:11.5px}
.lstrip li.done{color:var(--brass)}
.lstrip li.now{color:#1a140a;background:var(--glow);box-shadow:0 0 10px rgba(246,210,122,.6)}
.lbanner{left:50%;top:300px;transform:translate(-50%,0) scale(.9);z-index:75;opacity:0;pointer-events:none;text-align:center;transition:opacity .35s,transform .35s}
.lbanner.on{opacity:1;transform:translate(-50%,0) scale(1)}
.lbanner b{display:block;font-family:var(--f-title);font-weight:900;font-size:44px;letter-spacing:.1em;color:var(--text);text-shadow:var(--outline)}
.lbanner span{display:inline-block;margin-top:6px;font-family:var(--f-title);font-weight:700;font-size:18px;color:#1a140a;background:var(--glow);padding:3px 16px;border-radius:16px}
.lbanner.bad b{color:#ffb4a4}
.ask{--trim:#8a5f12;--trim-hi:#c99a3e}

    if(s[i]==='x'){i++;return (x,m)=>x;}if(s[i]==='m'){i++;return (x,m)=>m;}const mm=/^\d+(?:\.\d+)?/.exec(s.slice(i));if(mm){i+=mm[0].length;const c=+mm[0];return ()=>c;}throw Error('式子读不了：'+src);};
  const W=()=>{const b=P();if(s[i]==='^'){i++;const e=U();return (x,m)=>Math.pow(b(x,m),e(x,m));}return b;};
  const U=()=>{if(s[i]==='-'){i++;const f=U();return (x,m)=>-f(x,m);}if(s[i]==='+'){i++;return U();}return W();};
  const T=()=>{let f=U();while(s[i]==='*'||s[i]==='/'){const op=s[i++],g=U(),a=f;f=op==='*'?(x,m)=>a(x,m)*g(x,m):(x,m)=>a(x,m)/g(x,m);}return f;};
  const E=()=>{let f=T();while(s[i]==='+'||s[i]==='-'){const op=s[i++],g=T(),a=f;f=op==='+'?(x,m)=>a(x,m)+g(x,m):(x,m)=>a(x,m)-g(x,m);}return f;};
  const f=E();if(i!==s.length)throw Error('式子读不了：'+src);return f;}
const CMP=/(>=|<=|≥|≤|>|<|=)/;
function atomFn(a){const m=String(a).split(CMP);if(m.length!==3)throw Error('条件读不了：'+a);const l=exprFn(m[0]),r=exprFn(m[2]),op=m[1];
  const t={'>':d=>d>1e-9,'<':d=>d<-1e-9,'>=':d=>d>-1e-9,'≥':d=>d>-1e-9,'<=':d=>d<1e-9,'≤':d=>d<1e-9,'=':d=>Math.abs(d)<1e-9}[op];return {l,r,op,ok:(x,m)=>t(l(x,m)-r(x,m))};}
function condFn(src){const ors=String(src).split(/\s*或\s*/).map(p=>p.split(/\s*且\s*/).map(atomFn));return (x,m)=>ors.some(and=>and.every(a=>a.ok(x,m)));}
/* 学生填的数：+3、-5、−5、3/2、-1.5 都认 */
function parseNum(s){s=String(s??'').trim().replace(/[−－]/g,'-').replace(/＋/g,'+').replace(/／/g,'/');if(!s)return NaN;
  const f=/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/.exec(s);if(f)return +f[1]/+f[2];return /^[+-]?\d+(?:\.\d+)?$/.test(s)?+s:NaN;}
const fmt=v=>{if(Math.abs(v-Math.round(v))<1e-9)return String(Math.round(v));return String(Math.round(v*100)/100);};
const short=l=>String(l).replace(/\\dfrac/g,'\\tfrac');

/* ---------- 集合 ---------- */
let DSET={};
const setOf=k=>B.L.集[k];
function inSet(k,x){const S=setOf(k);if(S.且)return S.且.every(q=>inSet(q,x));if(S.或)return S.或.some(q=>inSet(q,x));if(!DSET[k])DSET[k]=atomFn(S.式);return DSET[k].ok(x);}
const setName=k=>{const S=setOf(k);return S&&S.显名?S.显名:'$'+k+'$';};
const baseSets=()=>Object.keys(B.L.集).filter(k=>B.L.集[k].式);
/* 点的写法：是哪个根，就用它的标签 */
function lab(x){for(const k of baseSets())for(const r of (setOf(k).根||[]))if(Math.abs(r[0]-x)<1e-9)return r[1];return fmt(x);}
const lx=x=>'$'+short(lab(x))+'$';
const eqDec=x=>{const l=short(lab(x)),d=fmt(x);return l===d?l:l+'='+d;};
function whyBase(k,x){const S=setOf(k);if(!DSET[k])DSET[k]=atomFn(S.式);const v=DSET[k].l(x),ok=inSet(k,x);return `$${S.显}=${fmt(v)}$，${ok?'':'不'}满足 $${S.号}$`;}
function why(k,x){const S=setOf(k);if(S.式)return whyBase(k,x);return (S.且||S.或).map(q=>`${inSet(q,x)?'在':'不在'} $${q}$ 里（${whyBase(q,x)}）`).join('，');}
/* 两点之间挑一个好代的数：先找整数，再找一位小数 */
function sampleIn(a,b){if(a===null)return Math.floor(b)-(Number.isInteger(b)?1:0);if(b===null)return Math.ceil(a)+(Number.isInteger(a)?1:0);
  const mid=(a+b)/2;let best=null;for(let k=Math.floor(a)+1;k<b;k++)if(k>a&&(best===null||Math.abs(k-mid)<Math.abs(best-mid)))best=k;if(best!==null)return best;
  const v=Math.round(mid*10)/10;return v>a&&v<b?v:mid;}
/* 已经找到的点（站住了“根X”的集合的根），按大小 */
function knownPts(){const out=[];baseSets().forEach(k=>{if(B.facts.has('根'+k))(setOf(k).根||[]).forEach(r=>{if(!out.some(o=>Math.abs(o[0]-r[0])<1e-9))out.push(r);});});return out;}
const sortedPts=()=>[...knownPts()].sort((a,b)=>a[0]-b[0]);
/* 主张：在点 pts 上，每段涂没涂（segs，n+1 个），每个点算不算（fill，n 个）。找出第一处和真相不符的地方 */
function mismatch(k,pts,segs,fill){const v=pts.map(p=>p[0]);
  for(let i=0;i<=v.length;i++){const s=sampleIn(i?v[i-1]:null,i<v.length?v[i]:null),t=inSet(k,s);if(!!segs[i]!==t)return {x:s,kind:'seg',claim:!!segs[i],truth:t};}
  for(let j=0;j<v.length;j++){const t=inSet(k,v[j]);if(!!fill[j]!==t)return {x:v[j],kind:'pt',claim:!!fill[j],truth:t};}return null;}
function cxText(k,m){const x=m.x,nm=setName(k),X=lx(x);
  if(m.kind==='seg')return `$x=${eqDec(x)}$：${why(k,x)}。所以 ${X} ${m.truth?'在':'不在'} ${nm} 里——${m.claim?'可你涂了这一段':'你漏了这一段'}。`;
  return `$x=${eqDec(x)}$：${why(k,x)}。端点 ${X} ${m.truth?'在':'不在'} ${nm} 里，要画${m.truth?'实心':'空心'}。`;}
/* 一个集合在点 pts 上的样子，合成几段（给小数轴画线用） */
function runsOf(k,pts){const v=pts.map(p=>p[0]),n=v.length,on=[];for(let i=0;i<=n;i++)on.push(inSet(k,sampleIn(i?v[i-1]:null,i<n?v[i]:null)));
  const out=[];let i=0;while(i<=n){if(!on[i]){i++;continue;}let j=i;while(j<n&&on[j+1])j++;out.push([i===0?null:v[i-1],j===n?null:v[j]]);i=j+1;}return out;}

/* ---------- 音效：WebAudio 现合成，不用外部文件；右下角可关 ---------- */
const SFX=(()=>{let ac=null;const ok=()=>SAVE.sfx!==false;const C=()=>ac||(ac=new (window.AudioContext||window.webkitAudioContext)());
  function tone(f,d,type,g,slide,delay){if(!ok())return;try{const c=C(),t=c.currentTime+(delay||0),o=c.createOscillator(),v=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);v.gain.setValueAtTime(g||.12,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
  function noise(d,g,hp,delay){if(!ok())return;try{const c=C(),t=c.currentTime+(delay||0),n=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,n,c.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(),f=c.createBiquadFilter(),v=c.createGain();s.buffer=buf;f.type='highpass';f.frequency.value=hp||600;v.gain.value=g||.2;s.connect(f).connect(v).connect(c.destination);s.start(t);}catch(e){}}
  return {tone,noise,pick:()=>tone(720,.06,'triangle',.07),scan:()=>{tone(500,.25,'sine',.05,500);},shield:()=>{tone(520,.25,'sine',.08,520);tone(1040,.3,'sine',.04,0,.05);},
    wind:()=>tone(320,.38,'sawtooth',.05,-200),whoosh:()=>noise(.35,.12,1400),hit:()=>{noise(.16,.22,1500);tone(140,.22,'sine',.22,-70);},
    hurt:()=>{noise(.28,.3,250);tone(95,.38,'square',.1,-45);},block:()=>{tone(1480,.42,'sine',.11,260);tone(2220,.3,'sine',.05,0,.04);},fizz:()=>{noise(.3,.08,3000);tone(600,.3,'triangle',.05,-400);},
    brk:()=>{noise(.4,.25,900);[880,1175,1480].forEach((f,i)=>tone(f,.18,'square',.05,0,i*.06));},peel:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.32,'triangle',.08,0,i*.08)),
    boom:()=>{tone(62,1,'sine',.32,-24);noise(.7,.16,120);},win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.5,'triangle',.09,0,i*.11)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.55,'sine',.1,0,i*.2))};})();

/* ---------- 几何：所有“真值”都从这里算，不抄公式 ---------- */
function coef(G,kind,v){const a2=G.a2,b2=G.b2,px=G.点[0],py=G.点[1];if(kind==='k'){const c=py-v*px;return {a:b2+a2*v*v,b:2*a2*v*c,c:a2*(c*c-b2)};}const d=px-v*py;return {a:b2*v*v+a2,b:2*b2*v*d,c:b2*(d*d-a2)};}
function meet(G,kind,v){const q=coef(G,kind,v),D=q.b*q.b-4*q.a*q.c;if(D<=1e-9)return null;const s=Math.sqrt(D),r1=(-q.b-s)/(2*q.a),r2=(-q.b+s)/(2*q.a),px=G.点[0],py=G.点[1];let x1,y1,x2,y2;if(kind==='k'){const c=py-v*px;x1=r1;x2=r2;y1=v*r1+c;y2=v*r2+c;}else{const d=px-v*py;y1=r1;y2=r2;x1=v*r1+d;x2=v*r2+d;}return {a:q.a,b:q.b,c:q.c,D,x1,y1,x2,y2,r1,r2,S:Math.abs(x1*y2-x2*y1)/2};}

/* ---------- 式子：4k^2、1+4k^2、√3/2、sqrt(…)、|k|、2t/(t^2+1) 都认。不用 eval ---------- */
function cx(src){let s=String(src==null?'':src).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[−－﹣–]/g,'-').replace(/＋/g,'+').replace(/[×·]/g,'*').replace(/[／÷]/g,'/').replace(/（/g,'(').replace(/）/g,')').replace(/²/g,'^2').replace(/．/g,'.').replace(/\s+/g,'');if(!s)throw Error('空');let i=0,abs=0;
  const prim=()=>{const c=s[i];if(c==='('){i++;const f=add();if(s[i++]!==')')throw Error('括号');return f;}
    if(c==='|'){i++;abs++;const f=add();if(s[i++]!=='|')throw Error('绝对值');abs--;return v=>Math.abs(f(v));}
    if(c==='√'){i++;const f=prim();return v=>Math.sqrt(f(v));}
    if(s.startsWith('sqrt',i)){i+=4;const f=prim();return v=>Math.sqrt(f(v));}
    if(c&&'kmtxy'.includes(c)){i++;return v=>v[c];}
    const m=/^\d+(?:\.\d+)?|^\.\d+/.exec(s.slice(i));if(m){i+=m[0].length;const n=+m[0];return ()=>n;}throw Error('读不懂');};
  const pow=()=>{const b=prim();if(s[i]==='^'){i++;const e=un();return v=>Math.pow(b(v),e(v));}return b;};
  const un=()=>{if(s[i]==='-'){i++;const f=un();return v=>-f(v);}if(s[i]==='+'){i++;return un();}return pow();};
  const mul=()=>{let f=un(),dv=false;for(;;){const c=s[i];if(c==='*'||c==='/'){i++;const g=un(),a=f;f=c==='*'?v=>a(v)*g(v):v=>a(v)/g(v);dv=c==='/';}else if(c&&(/[\d(√kmtsxy]/.test(c)||(c==='|'&&!abs))){if(dv)throw Error('歧义');const g=pow(),a=f;f=v=>a(v)*g(v);}else return f;}};
  const add=()=>{let f=mul();while(s[i]==='+'||s[i]==='-'){const c=s[i++],g=mul(),a=f;f=c==='+'?v=>a(v)+g(v):v=>a(v)-g(v);}return f;};
  const f=add();if(i!==s.length)throw Error('读不懂');return f;}

function dkc(s){if(s===undefined||s===null||s===true)return true;return String(s).split('||').some(o=>o.split('&&').every(a=>{a=a.trim();const neg=a[0]==='!';if(neg)a=a.slice(1);const p=a.split('.'),n=p[0],k=p[1];const v={f:B.f,st:B.stamp,hd:B.hard,used:B.used,att:B.att}[n];const r=n==='队'?onTeam(k):n==='有'?inDeck(k):n==='看'?!!dkS().seen[k]:n==='猜'?B.guess===k:v?!!v[k]:false;return neg?!r:r;}));}

function dkPool(){const y=B.D.层[B.li],out=[];B.borrow={};(y.牌||[]).forEach(e=>{if(e.当&&!dkc(e.当))return;if(e.止&&dkc(e.止))return;const id=e.id,c=LIB()[id];if(!c||B.used[id]||out.includes(id))return;if(c.常||c.队招){out.push(id);return;}if(inDeck(id)){out.push(id);return;}if(e.必){out.push(id);B.borrow[id]=true;}});return out;}
function dkWeight(id){const c=LIB()[id],o=own(id);if(B.borrow[id])return .5;if(c.常||c.队招)return 2;let w=(o&&o.lv>1)?3:2;w+=Math.min((o&&o.use)||0,2)*.5;if(rusty(id))w=.5;return w;}
function dkDrawOne(rest){const tot=rest.reduce((a,id)=>a+dkWeight(id),0);let r=Math.random()*tot;for(const id of rest){r-=dkWeight(id);if(r<=0)return id;}return rest[rest.length-1];}

function dkRead(o){const a=o.a,vals=[],fns=[],fail=i=>({err:`第 ${i+1} 个读不懂。可以写 $1+4k^2$、$16k$、$7/4$、$\\sqrt3/2$（打 √3/2）。`});const plain=['数','反驳','死路'].includes(a.验.法);

function dkVerify(o,R){B.cmp=null;const v=o.a.验,G=B.G,kind=v.线||B.line,bad=(a,b)=>!(Math.abs(a-b)<=1e-6),V=(p,t)=>{const m={};m[kind]=p;if(t!==undefined)m.t=t;return m;},sh=p=>{B.showLine={kind,val:p,label:`${kind}=${fxx(p)}`,area:true};};

/* ---------- 每一步都拿真实几何验 ---------- */
const darkVars=(kind,p,t)=>{const v={};v[kind]=p;if(t!==undefined)v.t=t;return v;};
function darkExpr(raw,kind){let f;try{f=cx(raw);}catch(e){return {err:e.message==='歧义'?'“/”后面连着写，机器分不清分母到哪儿。加上括号，或者按“分数线”前先把分子分母各自括起来。':'读不懂。根号按 √，平方按 x²。'};}const v=f(darkVars(kind,1.3));if(!isFinite(v))return {err:`这儿用的字母是 $${kind}$，别的字母我不认识。`};return {f};}

function darkPeak(G){const SS=th=>{const kv=jKV(th),m=meet(G,kv[0],kv[1]);return m?m.S:0;};let bt=0,bs=-1;for(let i=0;i<=3140;i++){const th=i/1000;const v=SS(th);if(v>bs){bs=v;bt=th;}}let a=bt-.002,b=bt+.002;const g=.618;for(let i=0;i<60;i++){const c=b-g*(b-a),d=a+g*(b-a);if(SS(c)>SS(d))b=d;else a=c;}const th=(a+b)/2;return {th,S:Math.max(SS(th),bs),vert:Math.abs(th-Math.PI/2)<.002};}

  const kind=B.line,zm=kind==='k'?'x':'y',lostV=kind==='k';
  if(i===1){const lostTxt=lostV?`$x=${px}$`:`$y=${py}$`;return darkAsk({层:1,问:`你这种写法，丢了哪条过 $${nm}$ 的线？写出来。`,空:[{宽:2,提:'x=… 或 y=…'}],查:v=>{const s=String(v[0]).replace(/\s+/g,'').replace(/＝/g,'=');const p=s.split('=');if(p.length!==2||!/^[xy]$/.test(p[0]))return {err:'写成 $x=\\cdots$ 或 $y=\\cdots$。'};let n;try{n=numOf(p[1]);}catch(e){return {err:'等号右边写一个数。'};}if(!isFinite(n))return {err:'等号右边写一个数。'};if((lostV&&p[0]==='x'&&Math.abs(n-px)<1e-9)||(!lostV&&p[0]==='y'&&Math.abs(n-py)<1e-9))return null;B.showLine={kind:lostV?'m':'k',val:0,label:lostV?`x=${px}`:`y=${py}`,area:false};return {bad:lostV?`$y=kx+\\cdots$ 写不出的，是竖的那条：$x=${px}$。`:`$x=my+\\cdots$ 写不出的，是平的那条：$y=${py}$。`};},过(){darkMatter(lostV,lostTxt);}});}
  if(i===2){const tr=['a','b','c'].map(k=>v=>coef(G,kind,v[kind])[k]);return darkAsk({层:2,问:`代进椭圆，写出关于 $${zm}$ 的方程。字母用 $${kind}$。`,空:[{标:`$${zm}^2$ 的系数`,宽:1},{标:`$${zm}$ 的系数`,宽:1},{标:'常数',宽:1}],查:v=>{const fs=[];for(const x of v){const r=darkExpr(x,kind);if(r.err)return r;fs.push(r.f);}const bad=propCheck(fs,tr,kind,[1,2,-1.5],zm);if(bad){B.showLine=null;return {bad};}return null;},现:v=>`联立得 $${texW(v[0])}${zm}^2+${texW(v[1])}${zm}+${texW(v[2])}=0$`,过(){B.f.eq=true;darkHit('方程列好了',()=>darkStep(3),false,'两根');}});}

  if(i===5){const pk=darkPeak(G),c=Math.cos(pk.th),s=Math.sin(pk.th),useLine=kind==='k'&&pk.vert,want=useLine?px:kind==='k'?(s/c)**2:(c/s)**2,lab=useLine?'在哪条线取到：$x=$':`此时 $${kind}^2=$`,more=B.lit&&B.D.牌.refute;return darkAsk({层:5,问:'最大值是多少？在哪儿取到？',小:'在草稿纸上算，结果写这儿',空:[{标:'$S_{\\max}=$',宽:1},{标:lab,宽:1}],查:v=>{let a,b;try{a=numOf(v[0]);b=numOf(v[1]);}catch(e){return {err:'写数，可以写 $7/4$、$\\sqrt3/2$。'};}if(!isFinite(a)||!isFinite(b))return {err:'写数，可以写 $7/4$、$\\sqrt3/2$。'};if(Math.abs(a-pk.S)>.002){B.cmp={real:pk.S,mine:a};B.showLine={kind:pk.vert?'m':'k',val:pk.vert?0:Math.tan(pk.th),label:'它最大到这儿',area:true};return {bad:a<pk.S?`最大的那条线，面积有 $${fxx(pk.S)}$，比你写的大。`:`你写的 $${fxx(a)}$ 取不到。你自己拉拉看，最大只有 $${fxx(pk.S)}$。取等的那个数，在不在范围里？`};}if(Math.abs(b-want)>.005)return {bad:`面积对了，位置不对。你写的是 $${fxx(b)}$。`};return null;},现:v=>`$S_{\\max}=${texOf(v[0])}$，${useLine?`在 $x=${texOf(v[1])}$ 取到`:`此时 $${kind}^2=${texOf(v[1])}$`}`,过(){B.f.max=true;if(more)return darkHit(`$S_{\\max}=${fxx(pk.S)}$`,()=>darkStep(6),false,'顶');B.f.ref=true;darkHit(`$S_{\\max}=${fxx(pk.S)}$`,B.lit?paperWin:darkWin,true);}});}

/* ---------- 菜园：放锈的牌，换个条件亲手算一次。每磨对一次，下次撑得更久 ---------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function propCheck(fns,tr,vr,ps,nm){for(const p of ps){const v={};v[vr]=p;const a=fns.map(f=>f(v)),b=tr.map(f=>f(v));if(a.every(x=>Math.abs(x)<1e-9))return '三个都是 0，这不算方程。';let i=b.findIndex(x=>Math.abs(x)>1e-9),s=a[i]/b[i];if(!isFinite(s)||Math.abs(s)<1e-9||a.some((x,j)=>!(Math.abs(x-s*b[j])<1e-6)))return `取 $${vr}=${fxx(p)}$：应该是 $${fxx(b[0])}${nm}^2+${fxx(b[1])}${nm}+${fxx(b[2])}=0$（可以整体乘一个数）。你写的是 $${fxx(a[0])}${nm}^2+${fxx(a[1])}${nm}+${fxx(a[2])}=0$。`;}return null;}
const DRILL={
 elimY(){const a2=rnd([2,3,5,8]),c=rnd([2,3]),t=[`1+${a2}k^2`,`${2*a2*c}k`,`${a2*(c*c-1)}`];return {题:`把 $y=kx+${c}$ 代进 $\\dfrac{x^2}{${a2}}+y^2=1$，整理成关于 $x$ 的方程。`,式:'$\\square\\,x^2+\\square\\,x+\\square=0$',空:['$x^2$ 的系数','$x$ 的系数','常数'],验:f=>propCheck(f,t.map(cx),'k',[1,2],'x')};},
 elimX(){const a2=rnd([2,3,5,8]),d=rnd([2,3,-1]),t=[`m^2+${a2}`,`${2*d}m`,`${d*d-a2}`];return {题:`把 $x=my${d<0?'':'+'}${d}$ 代进 $\\dfrac{x^2}{${a2}}+y^2=1$，整理成关于 $y$ 的方程。`,式:'$\\square\\,y^2+\\square\\,y+\\square=0$',空:['$y^2$ 的系数','$y$ 的系数','常数'],验:f=>propCheck(f,t.map(cx),'m',[1,2],'y')};},
 dis(){const p=rnd([2,3,4]),q=rnd([4,6,8]),r=rnd([1,2,3]),T=cx(`${q*q-4*p*r}k^2-${4*r}`);return {题:`方程 $(1+${p}k^2)x^2+${q}kx+${r}=0$。写出判别式。`,式:'$\\Delta=\\square$',空:['$\\Delta=$'],验:f=>{for(const k of [1,2]){const a=f[0]({k}),b=T({k});if(!(Math.abs(a-b)<1e-6))return `取 $k=${k}$：$\\Delta=${fxx(b)}$；你写的是 $${fxx(a)}$。`;}return null;}};},
 sub(){const al=rnd([2,3,4]),be=rnd([1,2,3]),ga=rnd([1,2,3]),s=be+ga;return {题:`令 $t=\\sqrt{${al}k^2-${be}}$。把分母 $${ga}+${al}k^2$ 写成含 $t$ 的式子。`,式:'$'+ga+'+'+al+'k^2=\\square$',空:['用 $t$ 写：'],验:f=>{for(const t of [1,2,3]){const a=f[0]({t}),b=t*t+s;if(!(Math.abs(a-b)<1e-6))return `取 $t=${t}$：$${al}k^2=t^2+${be}=${t*t+be}$，分母是 $${fxx(b)}$；你写的是 $${fxx(a)}$。`;}return null;}};},
 amgm(){const [a,b,ans,why]=rnd([[4,1,'4','$t=2$ 在范围里，等号取得到。'],[4,3,'13/3','$t=2$ 不在范围里，等号取不到。在 $[3,+\\infty)$ 上它递增，最小在 $t=3$。'],[9,1,'6','$t=3$ 在范围里，等号取得到。'],[9,5,'34/5','$t=3$ 不在范围里，等号取不到。在 $[5,+\\infty)$ 上它递增，最小在 $t=5$。'],[1,2,'5/2','$t=1$ 不在范围里，等号取不到。在 $[2,+\\infty)$ 上它递增，最小在 $t=2$。']]);const T=numOf(ans);return {题:`$t\\ge${b}$ 时，求 $t+\\dfrac{${a}}{t}$ 的最小值。`,式:'最小值 $=\\square$',空:['最小值 $=$'],常:1,验:f=>{const v=f[0]({});return Math.abs(v-T)<1e-6?null:`你写的是 $${fxx(v)}$。${why}`;}};}
};

/* 装备、出刀 */
function gear(id){const c=B.L.牌[id],y=layer(),st=y.步.find(s=>s.类==='出刀'&&s.牌===id&&!B.done.has(s.id));
  if(!st){trap(B.li+':'+id,(y.坑&&y.坑[id])||c.坑||'这一层用不上这件装备。','转化与化归');return;}
  const miss=(c.孔||[]).filter(h=>!B.stamps.has(h));
  if(miss.length){trap(B.li+':'+id+'#孔',`孔没盖齐：还差「${miss.join('」「')}」。硬出刀就是“照名字出手”，打空了。`,'转化与化归');return;}
  openPanel(`<h4>装备 · ${esc(c.名)}<small>孔都盖上了，出刀</small></h4><div class="f">${tx(c.式)}</div><div class="holes">${(c.孔||[]).map(h=>`<div class="hole ok"><div class="ring">${h}</div><p></p></div>`).join('')}</div>
    <div class="qbox"><p>亲手结算。刀上那句是：</p><div class="calc">${tx(st.算||'')}</div><div class="fill" style="margin-top:12px">${st.填.map((f,i)=>`<label>${tx(f.名)} <input id="fin${i}" inputmode="decimal" aria-label="${esc(f.名.replace(/\$/g,''))}"></label>`).join('')}<button class="qbtn pri" type="button" id="fgo">出刀</button><button class="qbtn" type="button" id="pclose">先收回</button></div><div class="say" id="fsay"></div></div>`);
  $('pclose').onclick=closePanel;$('fin0').focus();
  const go=()=>{const vals=st.填.map((f,i)=>$('fin'+i).value.trim());if(vals.some(v=>v===''||Number.isNaN(parseNum(v)))){const fs=$('fsay');fs.className='say bad';fs.textContent=vals.some(v=>v==='')?'每一格都要填。':'只填数：整数、小数或分数（比如 29/4）。';return;}
    const bad=st.填.findIndex((f,i)=>!(Math.abs(parseNum(vals[i])-f.答)<=1e-9));
    if(bad<0){closePanel();B.used.add(id);const w=B.mates.find(x=>x.lm===B.sent)||B.mates[1];if(w){poise(w,true);lunge(w);}setTimeout(()=>{slash(1170,520,-30);setTimeout(()=>slash(1190,580,20),160);flash(1150,560);complete(st);applyFx(st.效果);sayList(st.说);if(w)setTimeout(()=>poise(w,false),900);after();},300);return;}
    const f=st.填[bad],e=f.错||{};closePanel();trap(B.li+':'+id+'#算',e[vals[bad]]||e._||'算得不对。再算一遍。','转化与化归');};
  $('fgo').onclick=go;$('gpanel').addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
function parseNum(s){s=String(s).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[／÷]/g,'/').replace(/[−－﹣–]/g,'-').replace(/．/g,'.').replace(/^\+/,'').replace(/\s+/g,'');if(/^-?\d+(\.\d+)?$/.test(s))return +s;const m2=s.match(/^(-?\d+)\/(\d+)$/);return m2?m2[1]/m2[2]:NaN;}
function openPanel(h){$('veil').hidden=false;const g=$('gpanel');g.hidden=false;g.classList.remove('win');g.innerHTML=h;}
function closePanel(){$('veil').hidden=true;$('gpanel').hidden=true;}
/* 视线 */
function gaze(){const cost=B.L.支架.视线;if(!cost||SAVE.coins<cost)return;SAVE.coins-=cost;persist();B.gazeUsed++;logEv('gaze',{});
  let svg='',labs='';B.mates.forEach(mt=>{const g=(B.L.视线||{})[mt.lm];if(!g)return;const p=B.L.守卫.部位[g.看];const [x2,y2]=scr(pt(p.点));const [x1,y1]=mt.eye;
    const text=g.文||(B.everDone.has(g.分界)?g.后:g.前);const cx=(x1+x2)/2,cy=Math.min(y1,y2)-150;
    svg+=`<path class="ln" d="M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}" stroke="${mt.hi}"/><circle class="gring" cx="${x2}" cy="${y2}" r="26" stroke="${mt.hi}"/><ellipse cx="${x1}" cy="${y1}" rx="9" ry="6" fill="#efe5cb" stroke="#0b0f0d" stroke-width="1.5"/><circle cx="${x1}" cy="${y1}" r="3" fill="#0b0f0d"/>`;
    const [lx,ly]=[Math.min(1330,x2+30),Math.max(120,y2-30)];labs+=`<div class="glabel abs" style="left:${mt.lm==='构造'?780:lx}px;top:${mt.lm==='构造'?470:ly}px;--c:${mt.hi}"><b>${mt.nm} · 盯着这里</b>${tx(text)}</div>`;});
  $('gaze').innerHTML=svg;$('glabels').innerHTML=labs;say('转化与化归','看她们的眼睛。谁盯着哪儿，就知道该查哪儿、派谁。',3600);clearTimeout(B.gt);B.gt=setTimeout(clearGaze,11000);renderAll();}
function clearGaze(){$('gaze').innerHTML='';$('glabels').innerHTML='';}
/* 胜利、落笔 */
function victory(){B.end=true;clearGaze();renderAll();flash(1260,480);const n=B.L.层.length,extra=B.round-n;const stars=extra<=0?3:extra<=2?2:1;B.stars=stars;
  const xp=40+(stars===3?20:stars===2?10:0);SAVE.xp+=xp;if(stars===3)SAVE.coins=Math.min(9,SAVE.coins+1);SAVE.cleared[B.id]=Math.max(SAVE.cleared[B.id]||0,stars);persist();logEv('win',{stars});
  setTimeout(()=>{(B.L.结算||[]).forEach(l=>toast(l[l.length-1]));const traps=B.trapLog;
    openPanel(`<h4>守卫散了<small>${esc(B.L.名)}</small></h4><div class="stars">${[1,2,3].map(i=>`<i class="${i<=stars?'on':''}">★</i>`).join('')}</div>
      <div class="res"><div><h6>回合</h6><p style="margin:0">用了 ${B.round} 回合，这颗洋葱有 ${n} 层。${stars===3?'一层一回合，干净。':'多出来的回合，是踩坑换来的经验。'}</p></div>
      <div><h6>踩过的坑（${traps.length}）</h6><ul>${traps.map(t=>`<li>第 ${t.layer+1} 层：${tx(t.msg)}</li>`).join('')||'<li>一个都没踩。</li>'}</ul></div>
      <div><h6>每层第一次就剥开</h6><p style="margin:0">${B.L.层.map((y,i)=>`${esc(y.名)} ${B.firstTry[i]?'✓':'✗'}`).join('　')}</p></div><div><h6>奖励</h6><p style="margin:0">经验 +${xp}${stars===3?'，提示币 +1':''}</p></div></div>
      <div class="qbtns" style="margin-top:14px"><button class="qbtn pri" type="button" id="toPen">落笔：在纸上写一遍</button></div>`);
    $('gpanel').classList.add('win');$('toPen').onclick=pen;},1600);}
function pen(){const P=B.L.落笔;openPanel(`<h4>落笔<small>${B.deckMode?'在纸上写一遍，再打勾':'照模板 A，在纸上抄一遍，再打勾'}</small></h4><div class="lbline">${P.行.map(tx).join('<br>')}</div><div class="chk">${P.清单.map((c,i)=>`<label><input type="checkbox" data-c="${i}"> ${tx(c)}</label>`).join('')}</div><div class="qbtns"><button class="qbtn pri" type="button" id="penok" disabled>写完了，盖章</button></div><div class="say" id="psay"></div>`);
  const boxes=[...document.querySelectorAll('#gpanel [data-c]')];boxes.forEach(b=>b.onchange=()=>{$('penok').disabled=!boxes.every(x=>x.checked);});
  $('penok').onclick=()=>{SAVE.coins=Math.min(9,SAVE.coins+1);SAVE.xp+=10;const day=86400000,now=Date.now();if(B.L.改条件&&!B.L.改条件.跳过)SAVE.garden.push({from:B.id,at:now,due:[now+day,now+3*day,now+7*day]});persist();logEv('pen',{});
    $('psay').innerHTML='<span class="xstamp" style="margin-left:0">已落笔</span> 提示币 +1。'+(B.L.改条件&&!B.L.改条件.跳过?'改条件守卫已经种进菜园，1、3、7 天后回马枪。':'');$('penok').disabled=true;
    $('psay').insertAdjacentHTML('afterend',`<div class="qbtns" style="margin-top:10px"><button class="qbtn" type="button" id="again">再打一遍</button><button class="qbtn" type="button" id="toDev">${B.deckMode?dkNextLabel():'选别的关'}</button></div>`);$('again').onclick=()=>startBattle(B.id);$('toDev').onclick=B.deckMode?dkOnward:devMenu;};}
/* 事件 */
$('endTurn').addEventListener('click',()=>{if(!B||B.duel||B.end||B.busy)return;clearMode();const y=layer();if(y.步.every(s=>B.done.has(s.id)))return;B.energy=0;closeLayer();});
$('gazeBtn').addEventListener('click',e=>{e.stopPropagation();gaze();});
document.querySelector('.scr[data-s="battle"]').addEventListener('click',()=>{if(B&&B.deckMode)return dkCancel();if(B&&B.mode)clearMode();});
addEventListener('keydown',e=>{if(!B||B.duel||!$('gpanel').hidden)return;if(/^[1-9]$/.test(e.key)){const id=handIds()[+e.key-1];if(id)pick(id);}else if(e.key==='Escape'&&B.mode)clearMode();});
/* 开发用：选关 */
function devMenu(){closePanel();const ids=Object.keys(DATA.battles),dz=Object.keys(DATA.duels||{});$('dev').hidden=false;$('dev').innerHTML=`<h4>选一关（开发用）</h4><h5 class="devh">卡牌版：试玩章</h5><div class="qbtns"><button class="qbtn pri" type="button" data-b="卡牌">从营地开始</button><button class="qbtn" type="button" data-b="椭圆-外点">定点在外面</button><button class="qbtn" type="button" data-b="椭圆-内点">定点在里面</button></div>${dz.length?`<h5 class="devh">新骨架样板（主张与反例）</h5><div class="qbtns">${dz.map(id=>`<button class="qbtn" type="button" data-b="${id}">${esc(id)} · ${esc(DATA.duels[id].名)}${SAVE.cleared[id]?' · '+'★'.repeat(SAVE.cleared[id]):''}</button>`).join('')}</div><h5 class="devh">旧骨架</h5>`:''}<div class="qbtns">${ids.map(id=>`<button class="qbtn" type="button" data-b="${id}">${esc(id)} · ${esc(DATA.battles[id].名)}${SAVE.cleared[id]?' · '+'★'.repeat(SAVE.cleared[id]):''}</button>`).join('')}</div>`;
  document.querySelectorAll('#dev [data-b]').forEach(b=>b.onclick=()=>{try{history.replaceState(null,'','#'+b.dataset.b);}catch(e){}startBattle(b.dataset.b);});}
(function boot(){const h=decodeURIComponent(location.hash.slice(1));if(h&&(h==='椭圆'||h==='卡牌'||(DATA.decks&&DATA.decks.关[h])||DATA.battles[h]||DATA.duels&&DATA.duels[h]))startBattle(h);else devMenu();})();

</script>
