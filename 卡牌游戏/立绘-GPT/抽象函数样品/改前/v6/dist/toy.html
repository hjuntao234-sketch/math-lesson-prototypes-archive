<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拖一个数</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 原型（Claude 2026-11-08）：一个动作——拖一个数。横轴是水面：泡水里 y<0，干的 y>0，踩水面 y=0。守卫的身体按公式实时画。 */
:root{--paper:#f1e8d2;--ink:#2a251c;--brass:#c49a4c;--wet:#3f9bd6;--dry:#e8964a;--red:#c0392b;--f:'Noto Serif SC',Georgia,serif;--b:'Noto Sans SC',system-ui,sans-serif}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0f0d}
#fit{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden;background:linear-gradient(#54706b,#2c3f3a);user-select:none;-webkit-user-select:none;touch-action:none;font-family:var(--b);color:var(--ink)}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.82) saturate(.8)}
#cv{position:absolute;inset:0;width:1600px;height:900px;cursor:grab}
#cv.drag{cursor:grabbing}
#gb,#read,#cards,#hud,#liesb{pointer-events:none}
.pill{position:absolute;background:rgba(14,20,18,.86);color:#f4eddc;border:1px solid #4d5f57;border-radius:14px}
#hud{left:24px;top:20px;padding:8px 16px;font:700 15px var(--b);display:flex;align-items:center;gap:10px}
#hearts{font-size:27px;letter-spacing:3px;color:#ff6a55;line-height:1}
#hearts i{font-style:normal;color:#55433f}
#liesb{right:24px;top:20px;padding:8px 16px;font:700 15px var(--b);display:flex;gap:8px;align-items:center}
#liesb b{display:inline-block;width:18px;height:18px;border-radius:50%;background:#ff8a5c;box-shadow:0 0 8px #ff8a5c}
#liesb b.off{background:#3a4640;box-shadow:none}
#snd{right:24px;top:70px;padding:3px 12px;font:500 13px var(--b);cursor:pointer}
#read{left:50%;top:20px;transform:translateX(-50%);padding:7px 20px;font:700 27px var(--f);white-space:nowrap;display:flex;gap:16px;align-items:center;min-height:44px;transition:top .3s}
#read small{font:500 16px var(--b);color:#c6d2cb}
.chip{font:900 18px var(--b);padding:3px 13px;border-radius:12px;color:#10201c;white-space:nowrap}
.chip.wet{background:#7cc8f5}.chip.dry{background:#f5b878}.chip.zero{background:#fff}
#gb{position:absolute;left:560px;top:190px;width:480px;box-sizing:border-box;padding:15px 20px;background:#231412;color:#ffefe9;border:3px solid var(--red);border-radius:18px;font:700 25px/1.5 var(--f);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:opacity .25s,transform .25s}
#gb small{display:block;font:700 13px var(--b);letter-spacing:.14em;color:#ff9f8c;margin-bottom:2px}
#gb.pop{animation:gpop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes gpop{from{transform:scale(.6);opacity:0}}
#gb.shatter{animation:shat .6s forwards}
@keyframes shat{20%{transform:scale(1.12) rotate(-3deg);filter:brightness(2)}100%{transform:scale(1.5) rotate(7deg);opacity:0;filter:blur(6px)}}
#tess{position:absolute;left:0;bottom:0;width:560px;height:280px;pointer-events:none}
#tess img{position:absolute;left:-10px;bottom:-250px;height:540px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
#tess.hurt img{animation:tflinch .55s}
@keyframes tflinch{20%{transform:translateX(-24px) rotate(-4deg);filter:brightness(1.4) sepia(1) saturate(4) hue-rotate(170deg)}}
#tb{position:absolute;left:206px;bottom:118px;width:330px;box-sizing:border-box;padding:11px 15px;background:var(--paper);border-radius:15px;font:700 18px/1.55 var(--f);box-shadow:0 0 0 2px var(--ink),0 8px 16px rgba(0,0,0,.4)}
#tb small{display:block;font:500 12px var(--b);color:#7a6e58}
#acts{position:absolute;right:30px;bottom:26px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.btn{font:900 28px var(--f);padding:14px 38px;border-radius:12px;border:3px solid #2a0f0b;background:linear-gradient(#e0553f,#a82c1e);color:#fff;cursor:pointer;box-shadow:0 5px 0 #2a0f0b,0 10px 22px rgba(0,0,0,.45);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a0f0b}
.btn.ok{background:linear-gradient(#5fb47a,#2f7d4a);border-color:#10301c;box-shadow:0 5px 0 #10301c,0 10px 22px rgba(0,0,0,.45);font-size:22px;padding:10px 26px}
.btn.gold{background:linear-gradient(#e8bd5f,#b4832a);border-color:#3a2a0b;color:#1e1505;text-shadow:none;box-shadow:0 5px 0 #3a2a0b,0 10px 22px rgba(0,0,0,.45)}
.lnk{font:500 15px var(--b);padding:6px 14px;border-radius:12px;border:1px solid #4d5f57;background:rgba(14,20,18,.86);color:#e6dfcc;cursor:pointer}
#lever{position:absolute;left:390px;right:390px;bottom:22px;height:76px;display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(14,20,18,.9);border:2px solid var(--brass);border-radius:18px;color:#f6edd8;font:900 30px var(--f)}
#lever input{flex:1;height:34px;accent-color:var(--brass);cursor:pointer}
#lever>span:first-child{width:26px}
#lever .v{width:150px;flex:none;text-align:right}
#lever .sc{position:absolute;left:72px;right:192px;bottom:3px;display:flex;justify-content:space-between;font:500 13px var(--b);color:#a9b4ad}
#lever.lock{opacity:.6;filter:saturate(.4)}
#cards{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:10px}
.fc{position:relative;width:176px;height:104px;border-radius:10px;background:#1b2521;border:2px solid #4d5f57;color:#f6edd8;overflow:hidden;box-sizing:border-box;text-align:center}
.fc canvas{position:absolute;left:0;top:0;width:172px;height:60px}
.fc .q{position:absolute;inset:0;display:grid;place-items:center;font:900 44px var(--f);color:#56665f}
.fc .n{position:absolute;left:0;right:0;bottom:3px;font:700 14px/1.25 var(--b);padding:0 4px}
.fc .n em{display:block;font:500 12.5px var(--f);color:#ffd98c}
.fc.rare{border-color:#d9a93c;box-shadow:0 0 12px rgba(217,169,60,.55)}
.fc.got{animation:fcflip .6s}
.fc.now{outline:3px solid #fff;outline-offset:2px}
.fc.cap{background:#29452f;border-color:#8fd19f}
@keyframes fcflip{0%{transform:rotateY(90deg)}100%{transform:none}}
#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,12,10,.62);z-index:9}
#modal .box{width:860px;box-sizing:border-box;background:var(--paper);border-radius:10px;padding:28px 36px;box-shadow:0 0 0 2px var(--ink),0 0 0 6px var(--brass),0 30px 70px rgba(0,0,0,.7)}
#modal h2{margin:0 0 8px;font:900 34px var(--f)}
#modal p{font:500 19px/1.7 var(--f);margin:8px 0}
#modal .pen{padding:12px 18px;border-left:5px solid var(--brass);background:rgba(42,37,28,.07);font:700 22px/1.9 var(--f)}
#modal .row{display:flex;gap:12px;margin-top:16px}
#marks{position:absolute;left:0;top:0;right:0;height:0}
.mk{position:absolute;top:-16px;transform:translateX(-50%);width:32px;height:32px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--red);color:#fff;font-size:15px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.5)}
#prev{left:50%;top:14px;transform:translateX(-50%);padding:9px 22px;font:700 20px var(--f);white-space:nowrap;pointer-events:none}
#cutbar{position:absolute;left:390px;right:390px;bottom:22px;min-height:76px;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px;background:rgba(14,20,18,.92);border:2px solid var(--brass);border-radius:18px;color:#f6edd8;font:900 27px var(--f)}
#ci{width:120px;font:700 26px var(--f);text-align:center;padding:5px 8px;border-radius:8px;border:2px solid var(--brass);background:#fffaf0;color:#2a251c}
#cutbar .btn{font-size:20px;padding:8px 20px}
#cil{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 16px var(--b);color:#d8d2c0;min-height:24px}
.mk2{font:700 15px var(--b);padding:3px 11px;border-radius:12px;border:1px solid #ff9f8c;background:#3a1a15;color:#ffd9cf;cursor:pointer}
.fc.tx{height:auto;min-height:84px;min-width:150px;width:auto;padding:0 8px}
#stage.dark #bg{filter:brightness(.34) saturate(.4)}
[hidden]{display:none!important}
</style>
<div id="fit"><div id="stage">
  <img id="bg" src="img/bg-river.webp" alt="" onerror="this.remove()">
  <canvas id="cv" width="1600" height="900"></canvas>
  <div class="pill" id="hud"><span>血量</span><span id="hearts"></span></div>
  <div class="pill" id="read"></div>
  <div class="pill" id="liesb"></div>
  <button class="pill" id="snd" type="button">音效：开</button>
  <div id="cards" hidden></div>
  <div class="pill" id="prev" hidden></div>
  <div id="cutbar" hidden><span>a =</span><input id="ci" autocomplete="off" aria-label="输入 a 的值"><button class="btn gold" id="cib" type="button">切一刀</button><div id="cil"></div></div>
  <div id="gb"></div>
  <div id="tess"><img id="ti" src="img/full/calm-tess.webp" alt="苔丝" onerror="this.remove()"><div id="tb"></div></div>
  <div id="lever" hidden><span>m</span><input id="mi" type="range" min="-3" max="3" step="0.1" value="0.5" aria-label="拖动 m"><span class="v" id="mv"></span><div id="marks"></div><div class="sc"><span>−3</span><span>−2</span><span>−1</span><span>0</span><span>1</span><span>2</span><span>3</span></div></div>
  <div id="acts"><button class="lnk" id="hintb" type="button">想不出来？（提示不限）</button><button class="btn ok" id="okb" type="button">它说对了</button><button class="btn gold" id="cutb" type="button" hidden>在这儿切一刀</button><button class="btn" id="hitb" type="button">打它！</button></div>
  <div id="modal" hidden></div>
</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d'),oc=document.createElement('canvas');oc.width=1600;oc.height=900;const oct=oc.getContext('2d');
(function(){const fit=()=>{const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`;stage._s=s;};addEventListener('resize',fit);fit();})();
const nz=v=>Math.abs(v)<1e-9?0:v;
const fmt=v=>{const r=Math.round(nz(v)*100)/100;return String(r).replace('-','−');};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 声音：拖的时候音高跟着 y 走，穿过水面“叮咚”一声 ---------- */
const A=(()=>{let c=null,hum=null,hg=null,on=true;const C=()=>{if(!c){const K=window.AudioContext||window.webkitAudioContext;if(!K)return null;c=new K();}if(c.state==='suspended')c.resume();return c;};
  const tone=(f,d,type,g,slide,dl)=>{if(!on)return;const a=C();if(!a)return;try{const t=a.currentTime+(dl||0),o=a.createOscillator(),v=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);v.gain.setValueAtTime(g||.1,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(a.destination);o.start(t);o.stop(t+d+.03);}catch(e){}};
  const noise=(d,g,hp,dl)=>{if(!on)return;const a=C();if(!a)return;try{const t=a.currentTime+(dl||0),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),q=b.getChannelData(0);for(let i=0;i<n;i++)q[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),v=a.createGain();s.buffer=b;fl.type='highpass';fl.frequency.value=hp||600;v.gain.value=g||.2;s.connect(fl).connect(v).connect(a.destination);s.start(t);}catch(e){}};
  return {humOn(){if(!on)return;const a=C();if(!a||hum)return;hum=a.createOscillator();hg=a.createGain();hum.type='triangle';hg.gain.value=0;hum.connect(hg).connect(a.destination);hum.start();hg.gain.setTargetAtTime(.035,a.currentTime,.05);},
    humOff(){if(hum&&c){hg.gain.setTargetAtTime(0,c.currentTime,.04);const h=hum;setTimeout(()=>{try{h.stop();}catch(e){}},200);hum=null;}},
    humY(y){if(hum&&c)hum.frequency.setTargetAtTime(240*Math.pow(2,clamp(y,-3,6)/4),c.currentTime,.03);},
    plip(){tone(1100,.14,'sine',.14,-800);tone(1600,.1,'sine',.07,-900,.05);},tick(){tone(700,.03,'triangle',.025);},
    flag(){tone(660,.1,'triangle',.1);tone(990,.16,'triangle',.1,0,.08);},hit(){noise(.2,.25,1200);tone(130,.28,'sine',.28,-70);},
    lie(){noise(.4,.28,1800);[784,988,1175,1568].forEach((f,i)=>tone(f,.28,'triangle',.08,0,.08+i*.07));},hurt(){noise(.3,.3,250);tone(95,.4,'square',.1,-45);},laugh(){[392,330,392,330].forEach((f,i)=>tone(f,.1,'square',.04,0,i*.11));},
    morph(){tone(300,.25,'sine',.08,500);},find(){[659,880,1175].forEach((f,i)=>tone(f,.25,'triangle',.09,0,i*.07));},rare(){[784,988,1318,1760,2093].forEach((f,i)=>tone(f,.35,'triangle',.09,0,i*.08));},win(){[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.5,'triangle',.09,0,i*.1));},
    toggle(){on=!on;if(!on)this.humOff();return on;}};})();

/* ---------- 状态 ---------- */
const S={lastCell:null,fade:0,act:1,hp:5,x:0,drag:false,dragged:false,t:0,m:.5,mS:.5,trail:new Map(),flags:[],lies:0,liesLeft:0,beat:0,busy:false,sel:new Set(),capturing:false,face:'smug',wob:0,shake:0,fx:0,fy:0,lastY:null,lastCell:null,blink:0,lockM:false,cards:[],card:-1,found:0,done:false,notes:[],faceSeen:new Set()};
const V={cx:460,ux:170,uy:90,y0:600,R:18};
const parts=[],ripples=[],balls=[];
const F1=x=>x*x-4*x+3;
const Fm=(x,m)=>m*x*x-(m+1)*x+1;
const F=x=>S.act===1?F1(x):S.act===3?S.ex.F(x,S.m):Fm(x,S.m);       // 判定用真值
const FD=x=>S.act===1?F1(x):S.act===3?S.ex.F(x,S.mS):Fm(x,S.mS);     // 画身体用平滑值
const px=x=>V.cx+x*V.ux,py=y=>V.y0-y*V.uy;
const xMin=()=>(40-V.cx)/V.ux,xMax=()=>(1560-V.cx)/V.ux;
const rootsAt=m=>{if(S.act===1)return S.flags.slice().sort((a,b)=>a-b);const r=[1];if(Math.abs(m)>1e-9){const q=1/m;if(Math.abs(q-1)>1e-9)r.push(q);}return r.sort((a,b)=>a-b);};
function nice(a,b){if(a===null)return Math.floor(b)-(Number.isInteger(b)?1:0);if(b===null)return Math.ceil(a)+(Number.isInteger(a)?1:0);const mid=(a+b)/2;let best=null;for(let k=Math.floor(a)+1;k<b;k++)if(k>a&&(best===null||Math.abs(k-mid)<Math.abs(best-mid)))best=k;if(best!==null)return best;const v=Math.round(mid*10)/10;return v>a&&v<b?v:mid;}
function segs(m){const r=rootsAt(m),o=[];for(let i=0;i<=r.length;i++)o.push({a:i?r[i-1]:null,b:i<r.length?r[i]:null});return o;}

/* ---------- 说话 ---------- */
function G(text,cls){const g=$('gb');g.hidden=false;g.className='';void g.offsetWidth;g.innerHTML='<small>守卫</small>'+esc(text);g.className=cls||'pop';}
function T(text){$('tb').innerHTML='<small>苔丝</small>'+esc(text);$('tb').hidden=false;S.idle=0;}
const hearts=()=>{$('hearts').innerHTML='♥'.repeat(Math.max(0,S.hp))+'<i>'+'♥'.repeat(Math.max(0,(S.hpMax||5)-S.hp))+'</i>';};
const lies=()=>{$('liesb').innerHTML='<span>破绽</span>'+Array.from({length:S.lies},(_,i)=>`<b class="${i<S.lies-S.liesLeft?'off':''}"></b>`).join('');};

/* ---------- 第一幕：拆谎。y=x²−4x+3 ---------- */
const A1=[
 {k:'lie',say:'我 y = x²−4x+3，全身干干净净，一滴水都没沾。不信你找。',wit:x=>F1(x)<-1e-9,demo:2,hint:'它中间那段是不是矮下去了？把浮标拖过去看看。',
  hit:(x,y)=>`x=${fmt(x)}，y=${fmt(y)}。这不是泡在水里吗！`,react:'……！谁让你往那儿看的！',miss:(x,y)=>`x=${fmt(x)}，y=${fmt(y)}，${y===0?'正好踩在水面上，也没泡水':'干得很'}。打空了！`},
 {k:'flags',say:'行，沾了一点。可我只有一只脚踩在水面上，绝对只有一只。',hint:'y 正好等于 0 的地方，就是脚。停在那儿，点“在这儿插旗”。找找看有几个。',react:'……那只是我的影子。'},
 {k:'lie',say:'那我换个说法：只要 x 是负数，我就泡在水里。',dom:x=>x<0,domMsg:'我说的是负数。你那个 x 不是负数，打不着我。',wit:x=>x<0&&F1(x)>1e-9,demo:-1,hint:'把浮标拖到 0 左边，随便挑一个负数，看 y 是正是负。',
  hit:(x,y)=>`x=${fmt(x)}，y=${fmt(y)}。干得不能再干了！`,react:'……你倒挺会代负数。',miss:(x,y)=>`打空了！`},
 {k:'truth',say:'这回真不骗你：x 在 1 和 3 中间，我确实泡在水里。',hint:'它也可能说真话。在 1 和 3 中间多拖几遍，有没有干的地方？',miss:(x,y)=>`x=${fmt(x)}，y=${fmt(y)}。${x>1&&x<3?'确实泡在水里呀':'我说的是 1 和 3 中间'}。这句是真的，打空了！`,note:'1<x<3 时，y<0',react:'……你倒不傻。'},
 {k:'wet',say:'那你说：x²−4x+3<0，解集是什么？点水面，把泡水的那段标出来。',hint:'两面旗把水面分成三段。点你觉得泡在水里的那段，再点“打它”。',react:'……'}
];
function startAct1(){Object.assign(S,{hpMax:5,lastCell:null,fade:0,act:1,hp:5,x:0,trail:new Map(),flags:[],beat:0,busy:false,sel:new Set(),capturing:false,face:'smug',lastY:null,lies:A1.length,liesLeft:A1.length,done:false,notes:[],card:-1,lockM:false});
  Object.assign(V,{cx:460,ux:170,uy:90,y0:600,R:18});S.fx=px(2);S.fy=py(F1(2));$('cards').hidden=true;$('lever').hidden=true;$('cutbar').hidden=true;$('prev').hidden=true;$('cutb').hidden=true;$('liesb').hidden=false;$('modal').hidden=true;$('gb').style.cssText='';$('read').style.top='20px';$('read').style.left='50%';hearts();lies();T('拖水面上的小浮标。它到哪，就把那个 x 代进去。');setBeat(0);}
function setBeat(i){S.beat=i;const b=A1[i];S.face='smug';G(b.say);S.capturing=b.k==='wet';S.sel=new Set();
  $('okb').hidden=!(b.k==='lie'||b.k==='truth');$('hitb').textContent=b.k==='flags'?'在这儿插旗':'打它！';$('hitb').hidden=false;$('hitb').className='btn'+(b.k==='flags'?' gold':'');S.idle=0;}
function strike1(){const b=A1[S.beat],x=S.x,y=F1(x);
  if(b.k==='flags'){if(nz(y)!==0){T(`这儿 y=${fmt(y)}，不是 0，脚还没踩到水面。`);return;}if(S.flags.some(f=>Math.abs(f-x)<1e-9)){T('这儿已经插过旗了。还有别的地方吗？');return;}S.flags.push(x);A.flag();burst(px(x),V.y0,'#ffe7a8',12);S.wob=.5;T(S.flags.length===1?'一只脚！它说就这一只。再找找？':'两只脚！它撒谎。');if(S.flags.length>=2)breakLie(b,'两面旗都插上了：y=0 的地方有两个。');return;}
  if(b.k==='lie'){if(b.dom&&!b.dom(x)){G(b.domMsg);return;}if(b.wit(x))return breakLie(b,b.hit(x,y));return missHit(b.miss(x,y));}
  if(b.k==='truth')return missHit(b.miss(x,y));
  if(b.k==='wet')return commitWet();}
function accept1(){const b=A1[S.beat];if(b.k==='truth'){S.notes.push(b.note);A.flag();T('记下来了：'+b.note+'。');S.liesLeft--;lies();G(b.react);S.face='annoyed';S.busy=true;setTimeout(()=>{S.busy=false;setBeat(S.beat+1);},1800);return;}
  if(b.k==='lie'){const d=b.demo;slideX(d,()=>{const y=F1(d);missHit(`哈哈，信了？看 x=${fmt(d)}：y=${fmt(y)}。我骗你的！`);});}}
